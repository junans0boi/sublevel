<title>SubLevel 레이스 방</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: one 1280x720 game screen (16:9) scaled to the page width; dialogs live inside the screen like the game's own overlays. Single dark look on purpose: it is the game's UI. */
:root{
  --ground:#0b0e12; --panel:rgba(16,20,26,.92); --panel-2:#1a212b; --panel-3:#232c38; --line:#2f3a48;
  --text:#e9edf1; --dim:#9aa5b1; --mute:#66717e; --steel:#80939f;
  --accent:#f29e26; --accent-ink:#2b1a02; --ready:#f2c230; --ready-ink:#3a2a00; --host:#3fb8c9; --host-ink:#05343b;
  --danger:#d2382e; --ok:#57c785; --blue:#5cc8f0;
  --font-ui:"Noto Sans KR",system-ui,sans-serif; --font-num:"Barlow Semi Condensed","Noto Sans KR",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{background:var(--ground);color:var(--text)}
body{font-family:var(--font-ui);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 28px}
.page{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.demo{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:13px;color:var(--dim)}
.demo b{color:var(--text);font-weight:500}
.demo button{font:inherit;color:var(--text);background:var(--panel-3);border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer}
.demo button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.frame{position:relative;width:100%;max-width:100%;overflow:hidden;border-radius:10px;border:1px solid var(--line)}
.stage{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;background:#141a22;overflow:hidden;font-size:15px}
button{font-family:var(--font-ui)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}
.bgscene{position:absolute;inset:0;background:linear-gradient(180deg,#1d2633 0%,#141a22 60%)}
/* room */
.top{position:absolute;left:16px;right:16px;top:14px;height:46px;display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:0 12px}
.top h1{font-size:18px;font-weight:700;margin:0;letter-spacing:.01em}
.pill{font-size:13px;color:#cdd6df;background:var(--panel-3);border-radius:4px;padding:3px 9px}
.pill.acc{color:var(--accent);background:rgba(242,158,38,.12)}
.sp{flex:1}
.tbtn{display:flex;align-items:center;gap:6px;background:transparent;border:1px solid transparent;color:var(--dim);font-size:14px;padding:6px 10px;border-radius:6px;cursor:pointer}
.tbtn:hover{color:var(--text);border-color:var(--line)}
.left{position:absolute;left:16px;top:72px;width:272px;bottom:16px;display:flex;flex-direction:column;gap:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px}
.course{padding:10px;display:flex;flex-direction:column;gap:6px}
.course svg{width:100%;height:132px;border-radius:6px;background:#1f2e24;display:block}
.course .nm{font-size:17px;font-weight:700}
.course .meta{font-size:13px;color:var(--dim)}
.diff{display:flex;gap:3px;align-items:center;font-size:12px;color:var(--dim)}
.diff i{width:14px;height:6px;border-radius:2px;background:var(--panel-3)}
.diff i.on{background:var(--danger)}
.chat{flex:1;display:flex;flex-direction:column;min-height:0}
.log{flex:1;overflow:auto;padding:8px 10px;font-size:13px;display:flex;flex-direction:column;gap:4px;color:#cdd6df}
.log .sys{color:var(--accent)}
.log b{font-weight:500;color:var(--text)}
.chatin{display:flex;gap:6px;padding:8px;border-top:1px solid var(--line)}
.chatin input{flex:1;min-width:0;background:var(--panel-3);border:1px solid var(--line);border-radius:6px;color:var(--text);font:inherit;font-size:13px;padding:6px 8px}
.grid{position:absolute;left:300px;right:16px;top:72px;height:540px;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:1fr 1fr;gap:8px}
.slot{position:relative;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;display:flex;flex-direction:column;overflow:hidden}
.slot.me{border-color:var(--host)}
.slot .hd{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:8px 10px 0;font-size:15px;font-weight:500}
.slot .lv{font-size:12px;color:var(--mute);font-weight:400}
.slot .x{position:absolute;right:6px;top:6px;width:24px;height:24px;border-radius:4px;border:none;background:transparent;color:var(--mute);cursor:pointer;font-size:16px;line-height:1}
.slot .x:hover{color:var(--text);background:var(--panel-3)}
.slot .carv{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:0 8px}
.slot .carv svg{width:92%;height:auto}
.slot .cn{font-size:13px;color:var(--dim)}
.slot .st{height:34px;display:flex;align-items:center;justify-content:center;gap:6px;font-weight:700;font-size:15px;letter-spacing:.04em}
.st.ready{background:var(--ready);color:var(--ready-ink)}
.st.wait{background:var(--panel-3);color:var(--dim);font-weight:500}
.st.host{background:var(--host);color:var(--host-ink)}
.st.bot{background:transparent;color:var(--mute);font-weight:500;border-top:1px dashed var(--line)}
.slot.empty{background:rgba(26,33,43,.55);border-style:dashed;cursor:pointer}
.slot.empty:hover{border-color:var(--steel)}
.slot.empty .carv{color:var(--mute);font-size:13px;text-align:center}
.slot.empty .carv svg{width:40px;height:40px}
.slot.closed{background:repeating-linear-gradient(135deg,rgba(26,33,43,.6) 0 10px,rgba(20,26,34,.6) 10px 20px)}
.bubble{position:absolute;left:10px;top:34px;background:#f4f6f8;color:#1b2230;font-size:12px;padding:5px 8px;border-radius:6px;max-width:80%;z-index:2}
.bar{position:absolute;left:300px;right:16px;bottom:16px;height:76px;display:flex;align-items:stretch;gap:8px}
.bbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-width:92px;background:var(--panel);border:1px solid var(--line);border-radius:8px;color:#cdd6df;font-size:13px;cursor:pointer;padding:0 12px}
.bbtn:hover:not(:disabled){border-color:var(--steel);color:var(--text)}
.bbtn:disabled{opacity:.45;cursor:not-allowed}
.bbtn svg{width:24px;height:24px}
.mycar{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:0 12px;flex:1;min-width:0;font-size:13px;color:var(--dim)}
.mycar b{color:var(--text);font-weight:500;font-size:15px}
.mycar svg{width:110px;height:auto;flex:none}
.go{width:240px;border:none;border-radius:8px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:22px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.go small{font-size:12px;font-weight:500;opacity:.8}
.go.off{background:var(--panel-3);color:var(--dim);cursor:not-allowed}
.go.unready{background:var(--ready);color:var(--ready-ink)}
.go.cancel{background:var(--panel-3);color:var(--text);border:1px solid var(--ready)}
/* overlays */
.ov{position:absolute;inset:0;background:rgba(5,7,10,.66);display:flex;align-items:center;justify-content:center;z-index:20}
.dlg{background:#141a22;border:1px solid var(--line);border-radius:10px;width:880px;max-height:640px;display:flex;flex-direction:column;overflow:hidden}
.dlg header{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.dlg header h2{margin:0;font-size:19px;font-weight:700}
.dlg header .sp{flex:1}
.dlg .body{padding:16px 18px;overflow:auto;flex:1}
.dlg footer{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--line)}
.btn{font:inherit;font-size:14px;border-radius:6px;padding:8px 16px;cursor:pointer;border:1px solid var(--line);background:var(--panel-3);color:var(--text)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.ghost{background:transparent}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff;font-weight:500}
.garage{display:grid;grid-template-columns:240px 1fr;gap:16px}
.clist{display:flex;flex-direction:column;gap:6px}
.citem{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel-2);cursor:pointer;text-align:left;color:var(--text)}
.citem[aria-selected="true"]{border-color:var(--accent);background:rgba(242,158,38,.08)}
.citem svg{width:64px;height:auto;flex:none}
.citem .t{display:flex;flex-direction:column;font-size:14px}
.citem .t span{font-size:12px;color:var(--dim)}
.preview{display:flex;flex-direction:column;gap:12px}
.pv{background:radial-gradient(ellipse at 50% 80%,#2a3442 0%,#151b23 70%);border-radius:8px;height:200px;display:flex;align-items:center;justify-content:center}
.pv svg{width:70%;height:auto}
.pvh{display:flex;align-items:baseline;gap:10px}
.pvh h3{margin:0;font-size:22px}
.pvh span{color:var(--dim);font-size:14px}
.stats{display:grid;grid-template-columns:72px 1fr 34px;gap:6px 10px;align-items:center;font-size:13px;color:var(--dim)}
.sbar{height:8px;background:var(--panel-3);border-radius:4px;overflow:hidden}
.sbar i{display:block;height:100%;background:var(--blue);border-radius:4px;transition:width .25s}
.swatches{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--dim)}
.sw{width:26px;height:26px;border-radius:50%;border:2px solid transparent;cursor:pointer}
.sw[aria-pressed="true"]{border-color:var(--text)}
.note{font-size:12px;color:var(--mute)}
.ccards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.cc{display:flex;gap:12px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--panel-2);cursor:pointer;text-align:left;color:var(--text)}
.cc[aria-selected="true"]{border-color:var(--accent);background:rgba(242,158,38,.08)}
.cc svg{width:150px;height:90px;flex:none;border-radius:6px;background:#1f2e24}
.cc .t{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--dim)}
.cc .t b{font-size:16px;color:var(--text)}
.row{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:14px;color:var(--dim)}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:none;background:transparent;color:var(--dim);padding:6px 12px;cursor:pointer;font:inherit;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--panel-3);color:var(--text)}
.flist{display:flex;flex-direction:column;gap:6px}
.fr{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel-2);font-size:14px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mute)}
.dot.on{background:var(--ok)}.dot.busy{background:var(--accent)}
.fr .s{color:var(--dim);font-size:12px}
.field{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--dim);margin-bottom:14px}
.field input[type=text]{background:var(--panel-3);border:1px solid var(--line);border-radius:6px;color:var(--text);font:inherit;padding:8px 10px}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--text);margin-bottom:10px}
.err{color:#ff8a80;font-size:12px;min-height:16px}
.toast{position:absolute;left:50%;top:70px;transform:translateX(-50%);background:var(--panel-3);border:1px solid var(--line);color:var(--text);font-size:14px;padding:8px 14px;border-radius:6px;z-index:30;transition:opacity .3s}
.count{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--font-num);font-size:200px;font-weight:700;color:var(--text);background:rgba(5,7,10,.55);z-index:25}
/* menu */
.menu{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
.menu h2{font-size:30px;margin:0}
/* race HUD */
.race{position:absolute;inset:0;overflow:hidden}
.race svg.scene{position:absolute;inset:0;width:100%;height:100%}
.hud{position:absolute;background:rgba(10,13,18,.82);border-radius:6px}
.pos{left:16px;top:16px;width:220px;height:84px;display:flex;align-items:center;gap:22px;padding:0 16px}
.pos .k{font-size:12px;color:var(--dim)}
.pos .v{font-family:var(--font-num);font-size:50px;font-weight:700;line-height:1}
.pos .v small{font-size:22px;color:var(--dim)}
.board{left:16px;top:108px;width:240px;padding:4px 0;font-size:14px}
.board div{display:grid;grid-template-columns:26px 1fr 66px;padding:3px 10px;align-items:center}
.board .me{background:#1f6fd1}
.board .g{text-align:right;color:var(--dim);font-family:var(--font-num)}
.board .me .g{color:var(--text)}
.laptime{left:50%;top:16px;transform:translateX(-50%);padding:6px 18px;font-family:var(--font-num);font-size:32px;font-weight:600}
.gap{left:50%;top:66px;transform:translateX(-50%);background:transparent;color:var(--ready);font-size:14px}
.mini{right:16px;top:16px;width:200px;height:170px}
.best{left:16px;bottom:16px;padding:8px 14px;font-size:13px;color:var(--dim)}
.best b{display:block;font-family:var(--font-num);font-size:24px;color:var(--text);font-weight:600}
.clus{left:50%;bottom:16px;transform:translateX(-50%);width:420px;height:104px;display:flex;align-items:center;gap:14px;padding:0 16px}
.clus .gear{font-family:var(--font-num);font-size:64px;font-weight:700;width:44px;text-align:center}
.clus .led{display:flex;align-items:flex-end;gap:3px;height:60px;flex:1}
.clus .led i{flex:1;background:#2b333d;border-radius:1px}
.clus .spd{font-family:var(--font-num);font-size:54px;font-weight:700;width:104px;text-align:right}
.clus .u{font-size:12px;color:var(--dim);align-self:flex-end;margin-bottom:22px}
.esc{right:16px;bottom:16px;padding:0}
@media (prefers-reduced-motion:reduce){.sbar i{transition:none}}
</style>

<div class="page">
  <div class="demo" role="group" aria-label="목업 조작">
    <b>목업 조작</b>
    <span>시점</span>
    <button id="asHost" aria-pressed="true">방장</button>
    <button id="asGuest" aria-pressed="false">참가자</button>
    <span style="margin-left:8px">친구 상태</span>
    <button id="friendsReady">친구 모두 준비</button>
    <button id="reset">처음 상태로</button>
    <span class="note">버튼은 모두 실제로 동작합니다. 초대한 친구는 잠시 뒤 들어오고 스스로 준비합니다.</span>
  </div>
  <div class="frame" id="frame"><div class="stage" id="stage"></div></div>
</div>

<script>
(function(){
"use strict";
const CARS=[
 {id:"GoblinV12",name:"GoblinV12",kind:"스포츠카",shape:"sport",top:220,red:8200,cl:"C",acc:"#e5484d",stats:{속도:10,가속:9,코너링:5,접지:6,내구:4},line:"직선 최강, 헤어핀에서 뒤가 쉽게 빠짐"},
 {id:"LT80",name:"Fairheaven LT80",kind:"세단",shape:"sedan",top:175,red:7200,cl:"D",acc:"#ff7a1a",stats:{속도:8,가속:7,코너링:7,접지:7,내구:6},line:"무난한 균형형"},
 {id:"SW84",name:"Fairheaven SW84",kind:"왜건",shape:"wagon",top:160,red:6500,cl:"A",acc:"#5cc8f0",stats:{속도:7,가속:6,코너링:8,접지:7,내구:7},line:"코너가 많은 고개에서 강함"},
 {id:"Lifted85",name:"Lightbody Lifted85",kind:"픽업",shape:"pickup",top:150,red:6000,cl:"D",acc:"#f29e26",rugged:true,stats:{속도:6,가속:6,코너링:6,접지:9,내구:8},line:"비포장 지름길에서 속도가 덜 떨어짐"},
 {id:"Shvan92",name:"Shvan92",kind:"밴",shape:"van",top:130,red:5500,cl:"B",acc:"#57c785",stats:{속도:5,가속:5,코너링:5,접지:6,내구:10},line:"느리지만 부딪혀도 안 밀림"}
];
const PAINTS=["#c8342b","#e9edf1","#2d6fd6","#f2c230","#2f9e6a","#1c1f24"];
const COURSES=[
 {id:"circuit",name:"섬 서킷",mode:"loop",len:"543 m",elev:"평지",diff:2,path:"M30 70 C30 30 60 20 90 22 S150 20 150 50 S130 80 100 78 S60 92 30 70 Z"},
 {id:"up",name:"고개 업힐",mode:"sprint",len:"1.9 km",elev:"고저차 152 m",diff:4,path:"M14 80 C34 80 32 52 52 52 S68 76 88 72 S96 30 116 28 S146 42 142 12"},
 {id:"down",name:"고개 다운힐",mode:"sprint",len:"1.9 km",elev:"고저차 152 m",diff:4,path:"M142 12 C146 42 116 28 116 28 S96 30 88 72 S68 76 52 52 S34 80 14 80"},
 {id:"loop",name:"고개 순환",mode:"loop",len:"4.9 km",elev:"고저차 152 m",diff:5,path:"M20 80 C40 82 36 50 58 50 S76 78 96 70 S104 26 126 24 S150 40 140 60 S100 92 60 90 S20 92 20 80 Z"}
];
const FRIENDS=[
 {n:"민트초코",lv:12,st:"on"},{n:"도로위의사자",lv:7,st:"on"},{n:"새벽세시",lv:21,st:"busy"},{n:"감자칩",lv:3,st:"off"},{n:"한강라이더",lv:15,st:"on"}
];
const BOTN=["Flint","Glint","여울","Wren","Birch","Zephyr","Jade"];
const $=(s,r=document)=>r.querySelector(s);
const stage=$("#stage"),frame=$("#frame");
let S;
function fresh(){return{screen:"room",view:"host",room:"준환의 레이스",privateRoom:false,fillBots:true,course:1,laps:2,
 slots:[{p:{n:"준환",lv:8,car:0,paint:0,ready:false,me:true,host:true}},{p:{n:"민트초코",lv:12,car:4,paint:2,ready:true}},{p:{n:"도로위의사자",lv:7,car:1,paint:1,ready:false,say:"차 고르는 중"}},{},{},{},{},{closed:true}],
 chat:[["sys","준환 님이 방을 만들었습니다."],["민트초코","ㄱㄱ"],["도로위의사자","차 고르는 중"]],invited:{},dlg:null,toast:null,count:0,best:null};}
S=fresh();
function me(){return S.slots.find(s=>s.p&&s.p.me).p}
function hostP(){return S.slots.find(s=>s.p&&s.p.host).p}
function humans(){return S.slots.filter(s=>s.p).map(s=>s.p)}
function esc(t){return String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function carSVG(shape,paint,w){
 const c=PAINTS[paint]||paint,g="#9fb3c6",t="#11151b";
 const body={sport:"M10 52 L22 40 L58 30 L92 30 L118 40 L148 44 L152 54 L150 60 L10 60 Z",
  sedan:"M8 54 L16 42 L44 40 L60 26 L104 26 L122 40 L148 44 L152 60 L8 60 Z",
  wagon:"M8 54 L14 40 L40 38 L54 24 L140 24 L146 40 L152 46 L152 60 L8 60 Z",
  pickup:"M6 56 L12 36 L52 34 L60 18 L94 18 L100 34 L152 34 L154 58 L6 58 Z",
  van:"M8 58 L10 30 L22 14 L146 14 L152 22 L154 58 Z"}[shape];
 const win={sport:"M60 32 L90 32 L110 40 L48 40 Z",sedan:"M64 29 L102 29 L116 40 L52 40 Z",wagon:"M58 27 L136 27 L140 38 L46 38 Z",pickup:"M63 21 L91 21 L95 33 L57 33 Z",van:"M26 18 L60 18 L60 32 L16 32 Z"}[shape];
 const wy=shape==="pickup"||shape==="van"?58:60;

/* ---------- render ---------- */
function render(){
 const keepChat=document.activeElement&&document.activeElement.id==="chatin"?$("#chatin").value:null;
 let h="";
 if(S.screen==="room")h=roomHTML();
 else if(S.screen==="menu")h=`<div class="bgscene"></div><div class="menu"><h2>메인 메뉴</h2><p class="note">목업: 레이스 방을 나왔습니다.</p><button class="btn pri" data-act="new-room">레이스 방 만들기</button></div>`;
 else h=raceHTML();
 if(S.dlg){const k=S.dlg.k;h+=`<div class="ov" data-act="ov">${k==="garage"?garageHTML():k==="course"?courseHTML():k==="invite"?inviteHTML():k==="settings"?settingsHTML():k==="leave"?leaveHTML():resultHTML()}</div>`;}
 if(S.count)h+=`<div class="count" aria-live="assertive">${S.count}</div>`;
 if(S.toast)h+=`<div class="toast" role="status">${esc(S.toast)}</div>`;
 stage.innerHTML=h;
 const log=$("#log");if(log)log.scrollTop=log.scrollHeight;
 if(keepChat!==null&&$("#chatin")){$("#chatin").value=keepChat;$("#chatin").focus();}
 const f=$("#chatf");if(f)f.onsubmit=e=>{e.preventDefault();const v=$("#chatin").value.trim();if(!v)return;say(me().n,v);$("#chatin").value="";render();$("#chatin").focus();};
 const sf=$("#setf");if(sf){$("#rname").oninput=()=>{$("#rerr").textContent=""};sf.onsubmit=e=>{e.preventDefault();const v=$("#rname").value.trim();if(!v){$("#rerr").textContent="방 이름을 입력하세요.";$("#rname").focus();return;}
  S.room=v;S.privateRoom=$("#rpriv").checked;S.fillBots=$("#rbots").checked;S.dlg=null;say("sys","방 설정을 바꿨습니다.");render();};}
 document.querySelectorAll("#asHost,#asGuest").forEach(b=>b.setAttribute("aria-pressed",String((b.id==="asHost")===(S.view==="host"))));
}
function freeSlot(){return S.slots.findIndex((s,i)=>!s.p&&!s.closed&&!Object.values(S.invited).includes(i))}
function act(a,i,el,ev){
 const m=me();
 switch(a){
 case"garage":S.dlg={k:"garage",car:m.car,paint:m.paint};break;
 case"pick-car":S.dlg.car=i;break;
 case"paint":S.dlg.paint=i;break;
 case"save-car":m.car=S.dlg.car;m.paint=S.dlg.paint;S.dlg=null;say("sys",`${m.n} 님이 ${CARS[m.car].name}을(를) 골랐습니다.`);break;
 case"course":S.dlg={k:"course",course:S.course,laps:S.laps};break;
 case"pick-course":S.dlg.course=i;break;
 case"laps":S.dlg.laps=i;break;
 case"save-course":{const changed=S.course!==S.dlg.course||S.laps!==S.dlg.laps;S.course=S.dlg.course;S.laps=S.dlg.laps;S.dlg=null;
  if(changed){humans().forEach(p=>{if(!p.host)p.ready=false});say("sys",`코스가 ${COURSES[S.course].name}(으)로 바뀌어 모두 다시 준비해야 합니다.`);}break;}
 case"invite":case"inviteAny":if(freeSlot()<0){toast("빈 자리가 없습니다.");return;}S.dlg={k:"invite"};break;
 case"send-invite":{const f=FRIENDS[i],slot=freeSlot();if(slot<0){toast("빈 자리가 없습니다.");return;}S.invited[f.n]=slot;say("sys",`${f.n} 님에게 초대를 보냈습니다.`);
  setTimeout(()=>{if(S.invited[f.n]===undefined)return;const s=S.slots[slot];delete S.invited[f.n];if(s.p||s.closed){render();return;}
   s.p={n:f.n,lv:f.lv,car:(i+2)%CARS.length,paint:(i+3)%PAINTS.length,ready:false,say:"안녕"};say("sys",`${f.n} 님이 들어왔습니다.`);render();
   setTimeout(()=>{if(s.p&&s.p.n===f.n){s.p.ready=true;s.p.say=null;say(f.n,"준비 완료");render();}},2600);},1500);break;}
 case"close":S.slots[i]={closed:true};break;
 case"open":if(!m.host){toast("방장만 자리를 열 수 있습니다.");return;}S.slots[i]={};break;
 case"kick":{const p=S.slots[i].p;S.slots[i]={};say("sys",`${p.n} 님을 내보냈습니다.`);break;}
 case"settings":S.dlg={k:"settings",room:S.room,privateRoom:S.privateRoom,fillBots:S.fillBots};break;
 case"leave":S.dlg={k:"leave"};break;
 case"do-leave":S.dlg=null;S.screen="menu";break;
 case"new-room":{const v=S.view;S=fresh();S.view=v;applyView();break;}
 case"close-dlg":S.dlg=null;break;
 case"ov":if(ev&&el===ev.target&&S.dlg&&S.dlg.k!=="result")S.dlg=null;else return;break;
 case"ready":m.ready=!m.ready;say(m.n,m.ready?"준비 완료":"준비 취소");
  clearTimeout(act.auto);if(m.ready)act.auto=setTimeout(()=>{if(S.screen==="room"&&!me().host&&me().ready&&humans().every(p=>p.host||p.ready)){say(hostP().n,"출발!");startRace();}},2200);break;
 case"nostart":{const w=humans().filter(p=>!p.host&&!p.ready).map(p=>p.n);toast(`${w.join(", ")} 님이 아직 준비하지 않았습니다.`);return;}
 case"start":startRace();return;
 case"finish":{const field=raceField();const rows=field.map((x,k)=>({n:x.n,me:x.me,t:""}));const mine=rows.findIndex(r=>r.me);const meRow=rows.splice(mine,1)[0];rows.splice(1,0,meRow);
  rows.forEach((r,k)=>r.t=k===0?"1:44.812":"+"+(k*1.37+0.75).toFixed(3));cancelAnimationFrame(raf);S.dlg={k:"result",rows};break;}
 case"back-room":S.dlg=null;S.screen="room";humans().forEach(p=>{if(!p.host)p.ready=false});say("sys","레이스가 끝났습니다. 다시 준비해 주세요.");break;
 default:return;}
 render();
}
function startRace(){S.count=3;render();const tick=()=>{S.count--;if(S.count>0){render();setTimeout(tick,700);}else{S.screen="race";render();raceLoop();}};setTimeout(tick,700);}
stage.addEventListener("click",e=>{const el=e.target.closest("[data-act]");if(!el||el.disabled)return;act(el.dataset.act,el.dataset.i!==undefined?+el.dataset.i:-1,el,e);});
stage.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.matches(".slot[role=button]")){e.preventDefault();e.target.click();}
 if(e.key==="Escape"&&S.dlg&&S.dlg.k!=="result"){S.dlg=null;render();}});
document.addEventListener("keydown",e=>{if(e.key==="F5"&&S.screen==="room"&&!S.dlg){e.preventDefault();const g=goState();act(g.act,-1,null);}});
function applyView(){
 const host=S.slots[0].p,guest=S.slots[2].p;
 if(!host||!guest)return;
 if(S.view==="guest"){host.me=false;guest.me=true;host.n="민지";guest.n="준환";}else{host.me=true;guest.me=false;host.n="준환";guest.n="도로위의사자";}
 host.ready=false;guest.ready=false;
}
$("#asHost").onclick=()=>{S.view="host";applyView();render()};
$("#asGuest").onclick=()=>{S.view="guest";applyView();render()};
$("#friendsReady").onclick=()=>{humans().forEach(p=>{if(!p.me&&!p.host){p.ready=true;p.say=null}});render()};
$("#reset").onclick=()=>{cancelAnimationFrame(raf);S=fresh();render()};
function fit(){const w=frame.clientWidth,s=w/1280;stage.style.transform=`scale(${s})`;frame.style.height=(720*s)+"px"}
addEventListener("resize",fit);fit();render();
})();
</script>
