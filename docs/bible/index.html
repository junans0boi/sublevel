.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:10px 0}
.tw{overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
table{border-collapse:collapse;width:100%}th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{position:sticky;top:0;background:var(--panel);font-size:12px;color:var(--mute);white-space:nowrap}tr:last-child td{border-bottom:0}

 함(M1 범위 유지)"], "recommended": "지금 5종 유지 + 이후 DMR만 추가", "status": "confirmed", "answer": "일반 파밍 총기: SMG 3 / AR 5탄(5.56) 2 + 7탄(7.62) 2 / DMR 5탄 2 + 7탄 1 / SR 7탄 2 / 샷건 2(2탄·5탄짜리). LMG는 지금 필요 없음. 보급 총기는 따로(위 구성은 일반 파밍 가능 총기). 총기마다 스탯이 달라야 하며 항목은 이름·대미지·탄약(mm)·탄속(m/s)·저지력·RPM·DPS·사격 모드. 총기 이름은 저작권 문제 없는 선에서.", "why": "7.62mm가 Sentinel 한 자루에만 쓰여 탄 종류 대비 총이 적음. DMR이 7.62를 공유하면 탄 낭비 없음. 모델은 CC0 총기 팩 추가 조사 후."}, {"id": "w2", "q": "저격소총 Sentinel 전용 모델 확보", "options": ["CC0 저격 모델 조사(자산 라운드)", "돌격소총 늘린 임시 모양 유지"], "recommended": "CC0 저격 모델 조사(자산 라운드)", "status": "confirmed", "answer": "CC0 저격 모델 조사(자산 라운드) [준환 위임 일괄 확정 2026-11-16: 추천안 적용 — 검토 후 변경 가능]", "why": "CharacterKit.cs:33에 임시 형태라고 명시됨. 볼트 장전 애니메이션도 없음."}, {"id": "w3", "q": "TTK(몸통 기준) 목표", "options": ["소총 0.25~0.35초, SMG 0.25~0.4초, 저격 2발", "현재 수치 유지"], "recommended": "현재 수치 유지 후 플레이테스트로 조정", "status": "confirmed", "answer": "현재 수치 유지 후 플레이테스트로 조정 [준환 위임 일괄 확정 2026-11-16: 추천안 적용 — 검토 후 변경 가능]", "why": "현재 Warden 3발 ≈ 0.22초는 헬멧·조끼 감쇠 전 값. 조끼 3티어(55%)면 약 2배 늘어남 — 방어구와 같이 봐야 함."}, {"id": "w4", "q": "총 이름 실존 유사 여부 검토", "options": ["현재 이름 유지(VK-9/Ordo/Warden/Breacher/Sentinel)", "전면 개명"], "recommended": "현재 이름 유지", "status": "proposed", "answer": "", "why": "VK-9는 실존 모델명과 형태가 비슷할 수 있어 출시 전 사람이 상표 검토(RISKS 체크리스트). 신규 제안 이름은 실존 총기명 금지."}, {"id": "w5", "q": "산탄 근접 전탄 216 피해(펠릿 9x24)와 헬멧 보정", "options": ["유지(거리 감쇠 8→30m로 제어)", "펠릿 피해 하향"], "recommended": "유지", "status": "confirmed", "answer": "유지 [준환 위임 일괄 확정 2026-11-16: 추천안 적용 — 검토 후 변경 가능]", "why": "실제 근접 전탄 맞히는 경우가 드물지만 한 발 치명 가능 → 밸런스 검증 필요."}, {"id": "w6", "q": "빈 총(탄 없음) 클릭 소리 추가", "options": ["추가", "불필요"], "recommended": "추가", "status": "confirmed", "answer": "추가 [준환 위임 일괄 확정 2026-11-16: 추천안 적용 — 검토 후 변경 가능]", "why": "현재 코드에 빈 총 소리 없음."}, {"id": "w7", "q": "'저지력'은 무엇을 뜻하나?", "options": ["맞은 상대의 조준 흔들림·이동 감속(경직 강도) — 1~10 눈금", "방어구 관통력", "두 가지 모두(관통은 별도 스탯)"], "recommended": "맞은 상대의 조준 흔들림·이동 감속(경직 강도) — 1~10 눈금", "status": "confirmed", "answer": "맞은 상대의 조준 흔들림·이동 감속(경직 면에는 작가 표기를 위해 제목을 써야 하지만, 게임 안(HUD·상점·UI) 표시 이름은 우리가 지은 가상 이름을 쓰는 것이 안전하다. 법적 판단은 사람의 일(CLAUDE.md 규칙 8)이므로 RISKS_OPEN_QUESTIONS에 올려둔다."], "bullets": ["Dirt bike 모델 파일 내부 머티리얼 이름에 실존 타이어 브랜드(Mishelin) 철자가 있다. 화면에는 안 나옴(ledger V-0007 기록).", "'V12 Goblin'은 가상 이름이라 문제 없어 보이나 외형이 실존 슈퍼카와 닮았는지는 사람이 한 번 본다.", "인게임 이름 후보(제안): 세단 '해안 세단', 왜건 '여행 왜건', 픽업 '농장 픽업', 밴 '배달 밴', 스포츠 '질주', 오토바이 '산길 바이크'/'도로 바이크'."]}, {"type": "decisions", "title": "정해야 할 것", "items": [{"id": "dv1", "q": "차량 인게임 표시 이름은 어떻게?", "options": ["가상 한국어 이름을 새로 짓는다", "작품 제목을 그대로 쓴다", "종류만 표시(세단/밴 등)"], "recommended": "종류만 표시(세단/밴 등)", "status": "confirmed", "answer": "종류만 표시(세단/밴 등) [준환 위임 일괄 확정 2026-11-16: 추천안 적용 — 검토 후 변경 가능]", "why": "실존 차종 패러디 이름 위험을 피하고 구현이 가장 작다. 필요해지면 가상 이름을 추가."}, {"id": "dv2", "q": "차량 색 변형을 둘 것인가?", "options": ["모델당 1색 고정(현재)", "머티리얼 틴트로 3~5색 변형", "없음"], "recommended": "머티리얼 틴트로 3~5색 변형", "status": "confirmed", "answer": "머티리얼 틴트로 3~5색 변형 [준환 위임 일괄 확정 2026-11-16: 추천안 적용 — 검토 후 변경 가능]", "why": "차량 수가 적어 같은 차가 반복된다. 틴트 한 값이면 모델 추가 없이 변화가 생긴다. 법적 위험 없음."}, {"id": "dv3", "q": "50명 판에서 차량 대수는?", "options": ["10대 유지", "면적 비례 증가(차 12~16, 바이크 6~8)", "없음"], "recommended": "면적 비례 증가(차 12~16, 바이크 6~8)", "status": "confirmed", "answer": "면적 비례 증가(차 12~16, 바이크 6~8) [준환 위임 일괄 확정 2026-11-16: 추천안 적용 — 검토 후 변경 가능]", "why": "맵이 커지면 이동 수단이 없을 때 템포가 느려진다. 맵 크기 결정 뒤 확정."}, {"id": "dv4", "q": "차량 소리를 파일로 바꿀 것인가?", "options": ["합성 유지", "CC0 소리 파일 후보 조사 후 교체"], "recommended": "CC0 소리 파일 후보 조사 후 교체", "status": "confirmed", "answer": "CC0 소리 파일 후보 조사 후 교체 [준환 위임 일괄 확정 2026-11-16: 추천안 적용 — 검토 후 변경 가능]", "why": "합성 소리는 임시이고 체감 품질 약점. 오디오 트랙에서 후보를 조사한다. 사운드가 구매 필요하면 blocked."}, {"id": "dv5", "q": "오토바이 질량 190 vs 230 중 무엇이 물리에 쓰이는가?", "options": ["모델 값", "rules 값"], "recommended": "rules 값을 데이터 한 곳으로 통일", "status": "confirmed", "answer": "rules 값을 데이터 한 곳으로 통일 [준환 위임 일괄 확정 2026-11-16: 추천안 적용 — 검토 후 변경 가능]", "why": "VehicleModels와 rules.json에 값이 둘이라 헷갈린다. 코드에서 어느 쪽이 최종인지 확인 필요."}]}]}, {"id": "characters", "title" ble", "title": "지역 인접 관계(연결 규칙의 근거)", "columns": [{"key": "name", "label": "지역", "kind": "text"}, {"key": "adj", "label": "맞닿은 지역", "kind": "text"}, {"key": "notes", "label": "비고", "kind": "text"}], "rows": [{"id": "a0", "status": "proposed", "name": "북령 산악", "adj": "동령 고원, 청람읍권, 동천 평야", "source": "docs/research/map_options/option_C2_river_mountain.html"}, {"id": "a1", "status": "proposed", "name": "청람읍권", "adj": "북령 산악, 동천 평야, 서남 포구", "source": "docs/research/map_options/option_C2_river_mountain.html"}, {"id": "a2", "status": "proposed", "name": "서남 포구", "adj": "청람읍권 (단 하나)", "notes": "막다른 지역. 청람읍권이 먼저 닫히면 고립되므로 반드시 먼저 닫힌다.", "source": "docs/research/map_options/option_C2_river_mountain.html"}, {"id": "a3", "status": "proposed", "name": "동령 고원", "adj": "북령 산악, 동천 평야, 남동 해안", "source": "docs/research/map_options/option_C2_river_mountain.html"}, {"id": "a4", "status": "proposed", "name": "동천 평야", "adj": "북령 산악, 동령 고원, 청람읍권, 남동 해안", "source": "docs/research/map_options/option_C2_river_mountain.html"}, {"id": "a5", "status": "proposed", "name": "남동 해안", "adj": "동령 고원, 동천 평야", "source": "docs/research/map_options/option_C2_river_mountain.html"}]}, {"type": "prose", "title": "구역(오염) 순서 개념: 하이브리드", "paragraphs": ["준환이 하이브리드 오염 방식을 골랐다: 지역을 하나씩 오염시키되, 오염 전선이 수도 군집(청람읍권, 청람읍 도심) 쪽으로 수렴한다. 강과 산이 지역을 나누므로 다리와 고개가 병목이 되어 이동 전략이 생긴다.", "규칙(제안): (1) 폐쇄 순서는 시드로 정하되 남은 지역 집합이 항상 인접 관계로 이어져 있어야 한다(페이지가 시뮬레이션으로 보여준다). (2) 서남 포구는 청람읍권 하나에만 닿으므로 그보다 먼저 닫힌다. (3) 수렴 목표를 청람읍권으로 고정할지, 시드로 정할지는 아래 결정 항목이다(SPEC §3은 최종 지역 매 판 랜덤).", "이 방식은 게임 룰 변경이므로 DECISIONS.md ADR이 먼저 필요하다(CLAUDE.md 규칙 5). 오염 데미지·시간표·아이템 연동은 별도 설계 트랙이다."]}, {"type": "table", "title": "인원·밀도 비교", "columns": [{"key": "what", "label": "비교", "kind": "text"}, {"key": "value", "label": "수치", "kind": "text"}, {"key": "notes", "label": "비고", "kind": "text"}], "rows": [{"id": "d1", "status": "proposed", "what": "C2 (50명 / 육지 3.23 km2)", "value": "약 15.5명/km2", "notes": "박스(4.8 km2) 기준 10.4", "source": "docs/research/map_options/option_C2_notes.md"}, {"id": "d2", "status": "confirmed", "what": "현재 (16명 / 0.65 km2)", "value": "약 25명/km2", "notes": "31명이면 약 48", "source": "docs/research/06_missed_items.md B1"}, {"id": "d3", "status": "proposed", "what": "비교 원(참고)", "value": "반지름 950/680/470/300/170/70 m, 생존 예상 38/26/16/9/4/2", "notes": "하이브리드 방식과 비교용 오버레이(원 수축 방식)", "source": "docs/research/map_options/option_C2_notes.md"}]}, {"type": "prose", "title": "에셋·생성 메모", "bullets": ["건물: 완성된 한국 80년대/동남아 건물 CC0 에셋은 없다. 코드 생성 + 텍스처가 기본(05_map_assets §0). 종 확장(상가·아파트·학교·막사·감시탑 등)은 BuildingKind 변경이다.", "생성기에 필요한 것(02 §4, notes): 강 곡선과 하상 고도, 능선 폴리라인과 안부, 도로 절토(11도), 블록 생성기, 지역 6개와 승강장 20곳 규칙 파라미터화(MinElevators/Max, LotRange).", "성능: 411채는 PERF_BUDGET(드로우콜 2,500)에 비해 크다. 지역 단위 스트리밍/배칭 측정이 선행되어야 한다(06 I5).", "이름은 전부 가상. 실제 지명·상호 금지(CLAUDE.md 규칙 1). 종교 상징은 RISKS_OPEN_QUESTIONS에 올리고 보류(MASTER_PLAN §5, 05 §H).", "수치는 페이지 코드(시드 고정)에서 node로 추출했다. 건물 수는 시드 고정이므로 Unity 생성 결과와 다를 수 있다."]}, {"type": "decisions", "title": "정해야 할 것", "items": [{"id": "d-approve", "q": "C2 수치(2.4 x 2.0 km, 마을 17, 건물 411, 지역 6, 승강장 20)를 이대로 승인할까?", "options": ["승인", "일부 조정", "재검토"], "recommended": "승인", "status": "confirmed", "answer": "승인 [준환 위임 일괄 확정 2026-11-16: 추천안 적용 — 검토 후 변경 가능]", "why": "방향은 확정이나 수치는 미승인. 승인해야 ADR과 생성기 작업을 시작할 수 있다."}, {"id": "d-cap", "q": "수도급 청람읍 건물 수는?", "options": ["90채(진입 70)", "70채", "110채"], "recommended": "90채(진입 70)", "status": "confirmed", "answer": "90채(진입 70) [준환 위임 일괄 확정 2026-11-16: 추천안 적용 — 검토 후 변경 가능]", "why": "440 x 300 m에 90채가 페이지의 밀도이고 시가전 느낌과 성능(411채 총량)의 균형점."}, {"id": "d-regname", "q": "지역 이름 6개를 이대로 확정할까?", "options": ["그대로(북령 산악·청람읍권·서남 포구·동령 고원·동천 평야·남동 해안)", "수정"], "recommended": "그대로", "status": "confirmed", "answer": "그대로 [준환 위임 일괄 확정 2026-11-16: 추천안 적용 — 검토 후 변경 가능]", "why": "전부 가상 이름이고 지형 이름과 일치한다."}, {"id": "d-final", "q": "오염이 수렴하는 최종 지역은 청람읍권 고정인가, 시드 랜덤인가?", "options": ["청람읍권 고정", "시드 랜덤(청람읍권 가중)", "완전 랜덤"], "recommended": "시드 랜덤(청람읍권 가중)", "status": "confirmed", "answer": "6개 중 무작위, 육로 연결 보장(준환 결정, 청람읍권 가중은 적용하지 않음) [준환 위임 일괄 확정 2026-11-16: 추천안 적용 — 검토 후 변경 가능]", "why": "SPEC §3은 최종 지역 매 판 랜덤. 준환의 \"수도 군집으로 수렴\"과 맞추려면 가중이 절충안. 고정이면 같은 결말이 반복된다."}, {"id": "d-adr", "q": "하이브리드 오염 방식을 ADR로 먼저 기록하고 SPEC §3을 개정할까?", "options": ["예, 구현 전 ADR", "나중에"], "recommended": "예, 구현 전 ADR", "status": "confirmed", "answer": "예, 구현 전 ADR [준환 위임 일괄 확정 2026-11-16: 추천안 적용 — 검토 후 변경 가능]", "why": "게임 룰 변경은 ADR 후에만(CLAUDE.md 규칙 5)."}, {"id": "d-relig", "q": "종교 랜드마크(사당·사원 등)를 이번 라운드에서 보류할까?", "options": ["보류(RISKS에만 기록)", "포함"], "recommended": "보류(RISKS에만 기록)", "status": "confirmed", "answer": "보류(RISKS에만 기록). 중립 랜드마크로 대체 [준환 위임 '알아서']", "why": "법·문화 검토는 사람의 일(CLAUDE.md 규칙 8). 마을 고유 구조물은 학교·공장·항구·채석장으로 충분하다."}, {"id": "d-perf", "q": "411채 성능 측정을 생성기 작업보다 먼저 할까?", "options": ["예(측정 먼저)", "생성 후 측정"], "recommended": "예(측정 먼저)", "status": "confirmed", "answer": "예(측정 먼저) [준환 위임 일괄 확정 2026-11-16: 추천안 적용 — 검토 후 변경 가능]", "why": "PERF_BUDGET 위반은 머지 금지(규칙 6). 건물이 약 5배라 구조(스트리밍/배칭)가 달라질 수 있다."}]}]}, {"id": "towns", "title": "도시·마을", "order": 41, "group": "월드", "summary": "C2의 마을 17곳(수도급 1·대형 4·중형 6·hamlet 6)과 수도 청람읍의 블록 평면. 이름·건물 수는 설계 페이지의 시드 결과이며 모두 제안이다.", "status": "proposed", "parts": [{"type": "prose", "title": "마을 체계", "paragraphs": ["등급: 수도급(건물 90) · 대형 읍(38~50) · 중형 마을(16~21) · hamlet(4~8). 수도급은 블록·골목·상가 줄이 있는 시가전 구역이고, 나머지는 지형 단위로 흩어 파밍 동선을 만든다.", "마을마다 필수 고유 구조물 하나(학교·시장·항구·공장·채석장·고개)를 둬서 서로 달라 보이게 한다(02 §3 위험 (a)). 모든 이름은 가상이다."], "bullets": ["전체: 건물 411채(진입 305). 종류별 합계 — 주택 178·상가 138·빌라 22·노점 16·창고 14·막사 8·아파트 8·헛간 8·공장 6·학교 6·감시탑 5·시장 2.", "진입 가능률은 종류별 확률(주택 70%, 상가 85%, 빌라 80%, 나머지 100%, 노점·헛간 0%)로 정한 페이지 시드 결과다.", "루팅 등급·차량 수는 페이지의 자동 규칙(수도 3·대형 2·그 외 1대, 고개 스위치백 10곳 중앙에 1대씩, 합 33대)에서 나온 제안이다."]}, {"type": "table", "title": "마을 목록 (17곳)", "columns": [{"key": "name", "label": "이름", "kind": "text"}, {"key": "tier", "label": "등급", "kind": "tag"}, {"key": "region", "label": "지역", "kind": "tag"}, {"key": "style", "label": "스타일", "kind": "text"}, {"key": "total" _C2_river_mountain.html (capital plan)"}, {"id": "cap5", "status": "proposed", "part": "중앙로", "desc": "폭 12 m. 서쪽 끝에서 청람교까지 약 400 m 직선 시선. 주차 차량(읍 전체 53대)과 콘크리트 방벽이 40~60 m마다 시선을 끊는다.", "source": "docs/research/map_options/option_C2_river_mountain.html (capital plan)"}, {"id": "cap6", "status": "proposed", "part": "상가 뒷골목", "desc": "중앙로 양쪽 상가는 붙은 줄(틈 0.4 m)이고 그 뒤에 폭 3 m 보행 골목이 있다. 차량은 못 들어가 근접전이 된다.", "source": "docs/research/map_options/option_C2_river_mountain.html (capital plan)"}, {"id": "cap7", "status": "proposed", "part": "5층 아파트", "desc": "블록 최고층. 외벽 계단으로 옥상에 올라 중앙로와 시장을 내려다보지만 옥상은 노출되어 있다. 1층 상가 지붕(2~3층)과 높이차 2층.", "source": "docs/research/map_options/option_C2_river_mountain.html (capital plan)"}, {"id": "cap8", "status": "proposed", "part": "청람교와 제방길", "desc": "강 쪽 경계에 제방길 8 m, 청람교(차량 다리, 폭 12 m, 강폭 약 45 m) 앞에 방벽 5개와 감시탑. 구교(보행교 3 m)와 상류 얕은 여울이 우회로. 강 건너편에서 제방이 보여 엄폐가 낮다.", "source": "docs/research/map_options/option_C2_river_mountain.html (capital plan)"}, {"id": "cap9", "status": "proposed", "part": "서쪽 가장자리", "desc": "논·밭 띠(폭 약 30 m). 읍 둘레에 블록 밖 시야가 열린다.", "source": "docs/research/map_options/option_C2_river_mountain.html (capital plan)"}, {"id": "cap10", "status": "proposed", "part": "규모", "desc": "읍 전체 440 x 300 m. 건물 90채(주택 21·상가 36·빌라 6·아파트 4·학교 3·막사 4·공장 2·창고 2·시장 1·노점 8·감시탑 2·헛간 1), 진입 70.", "source": "docs/research/map_options/option_C2_river_mountain.html (capital plan)"}]}, {"type": "prose", "title": "청람읍 도시 구성", "paragraphs": ["청람읍은 강 서안 440 x 300 m 박스에 블록 16칸을 두고 읍 전체가 한눈에 읽히는 시가전 무대다. 한가운데 가로지르는 중앙로 12 m가 주축이고 양쪽 상가가 붙은 줄(틈 0.4 m)로 서고 뒤로 3 m 골목이 이어진다.", "북쪽에 학교와 운동장, 중앙 북쪽에 시장, 중앙 남쪽에 5층 아파트 단지, 남쪽에 막사와 공장과 창고, 강 쪽 끝에 제방과 청람교가 있다. 루팅은 남쪽(막사 무기고, 공장 보급창)이 상, 시장과 학교와 창고가 중이다.", "엘리베이터 승강장은 읍 서쪽 한 곳과 북쪽 한 곳, 합 2곳(페이지 ELEV). 교전은 중앙로 직선 시선, 뒷골목 근접전, 아파트 옥상 조망, 청람교 병목 4축이 이룬다."]}, {"type": "prose", "title": "현재 생성기와의 차이", "bullets": ["현재 마을 구역 C는 30채 안팎, 복합 단지당 3~7채, 건물 간 7.5 m 이상(WorldGenerator.cs:35), 블록·골목·울타리 개념 없음. 그래서 청람읍은 블록 생성기가 있어야 만들 수 있다(02 §4).", "건물 종류가 5개(BuildingPlan.cs:6)라 상가·아파트·학교·막사·감시탑은 BuildingKind 확장이 필요하다. 발소리·탄흔 재질이 종류 이름에 묶여 있어 연쇄 수정 지점이 최소 5곳(06 B3, B4)."]}, {"type": "decisions", "title": "정해야 할 것", "items": [{"id": "t-cap", "q": "청람읍 건물 수 90채(진입 70)를 확정할까?", "options": ["90채", "70채", "110채"], "recommended": "90채", "status": "confirmed", "answer": "90채 [준환 위임 일괄 확정 2026-11-16: 추천안 적용 — 검토 후 변경 가능]", "why": "페이지 확대도의 밀도. 현재 마을 C 30채의 3배."}, {"id": "t-names", "q": "마을 17곳의 이름(청람읍·새재·해옥포·광석리 등)을 이대로 쓸까?", "options": ["그대로", "준환이 일부 수정"], "recommended": "그대로", "status": "confirmed", "answer": "그대로 [준환 위임 일괄 확정 2026-11-16: 추천안 적용 — 검토 후 변경 가능]", "why": "전부 가상 이름. 실존 지명과 겹치는지는 사람이 확인해야 한다(규칙 8)."}, {"id": "t-relig", "q": "사당·사원·교회 등 종교 랜드마크를 보류할까?", "options": ["보류(RISKS 기록만)", "포함"], "recommended": "보류(RISKS 기록만)", "status": "confirmed", "answer": "종교 랜드마크(사당·사원·교회 등)는 이번 라운드에서 보류하고 RISKS에만 기록한다. 대신 중립 랜드마크(마을회관, 정자, 급수탑, 방송탑, 시장, 폐교 등)로 대체 [준환 위임 '알아서']", "why": "불상 등 종교 상징은 법·문화 검토 필요(05 §H, MASTER_PLAN §5). 고유 구조물은 학교·공장·항구·채석장으로 대체."}, {"id": "t-kinds", "q": "건물 종류를 5종에서 12종으로 확장해도 될까(BuildingKind 변경)?", "options": ["승인(파일·enum 변경)", "단계적으로 4종만 먼저"], "recommended": "단계적으로 4종만 먼저", "status": "confirmed", "answer": "단계적으로 4종만 먼저 [준환 위임 일괄 확정 2026-11-16: 추천안 적용 — 검토 후 변경 가능]", "why": "06 B3 권장은 상가·빌라·담 있는 주택·창고 변형 3~4종부터. 파일 구조 변경이라 준환 승인 필요(CLAUDE.md)."}, {"id": "t-loot", "q": "루팅 등급(상: 막사·공장 보급창)을 이대로 둘까?", "options": ["그대로", "조정"], "recommended": "그대로", "status": "confirmed", "answer": "그대로 [준환 위임 일괄 확정 2026-11-16: 추천안 적용 — 검토 후 변경 가능]", "why": "루팅 테이블은 현재 전역 1개 + 건물 종류별 차이 없음(06 I2). 종류별 테이블이 필요하다."}]}]}, {"id": "roads", "title": "도로·다리·고개", "order": 42, "group": "월드", "summary": "C2 도로망: 노드 22·엣지 29·순환 8, 합 약 12.2 km. 다리 5 + 얕은 여울 1, 차량 고개 5, 보행 안부 3. 일부 구간이 12도를 넘는 것이 알려진 문제(open).", "status": "proposed", "parts": [{"type": "prose", "title": "도로 체계", "paragraphs": ["도로 등급 3종: 국도(간선·순환, 폭 12 m) 약 2.8 km, 포장 지방도(8 m) 약 8.2 km, 비포장 농로·임도(4 m) 약 1.3 km. 모든 마을이 포장·국도만으로 이어지고(비포장은 hamlet 연결용), 포장·국도 엣지 하나가 끊어져도 전체가 이어진다(페이지 검사: connected, cutEdges 0, townsNotOnPaved 없음).", "고개 구간은 도로를 사인파 스위치백(진폭 58 m, 주기 150 m)으로 만들고 도로 경사를 11도 한도로 절토한다. 아래 경사는 절토 후 30 m 창 기준 최대/평균이다."], "bullets": ["현재 생성기(확정): Trunk 6 m / Spur 4.5 m / Path 2.5 m, 경사 12도 이하, 지역당 트리 형태, 지역 경계 고개 2개. 출처 WorldSpec.cs:55-57.", "도로 데이터 출처는 설계 페이지의 EDGES(수정하지 않은 원본)이며 길이는 곡선 길이를 노드에서 추출한 값이다."]}, {"type": "table", "title": "도로 구간 (29개)", "columns": [{"key": "name", "label": "구간", "kind": "text"}, {"key": "cls", "label": "등급", "kind": "tag"}, {"key": "len", "label": "길이 m", "kind": "num"}, {"key": "gmax", "label": "최대 경사 도", "kind": "num"}, {"key": "gavg", "label": "평균 경사 도", "kind": "num"}, {"key": "cut", "label": "절토 최대 m", "kind": "num"}, {"key": "sw", "label": "스위치백", "kind": "tag"}, {"key": "bridge", "label": "다리·여울", "kind": "text"}, {"key": "over", "label": "12도 초과", "kind": "tag"}], "rows": [{"id": "rd1", "status": "proposed", "name": "청람읍 - 새재", "cls": "국도", "len": 538, "gmax": 9.4, "gavg": 1.7, "cut": 3, "sw": "", "bridge": "청람교 51m", "over": "", "source": "docs/research/map_options/option_C2_river_mountain.html"}, {"id": "rd2", "status": "proposed", "name": "새재 - 논실", "cls": "국도", "len": 303, "gmax": 10.8, "gavg": 3.7, "cut": 4, "sw": "", "bridge": "", "over": "", "source": "docs/research/map_options/option_C2_river_mountain.html"}, {"id": "rd3", "status": "proposed", "name": "논실 - 남령재", "cls": "국도", "len": 208, "gmax": 7.5, "gavg": 4, "cut": 2, "sw": "스위치백", "bridge": "동천교 29m", "over": "", "source": "docs/research/map_options/option_C2_river_mountain.html"}, {"id": "rd4", "status": "proposed", "name": "남령재 - 광석리", "cls": "국도", "len": 329, "gmax": 18.1, "gavg": 3.4, "cut": 4, "sw": "스위치백", "bridge": "", "over": "12도 초과", "source": "docs/research/map_options/option_C2_river_mountain.html"}, {"id": "rd5", "status": "proposed", "name": "광석리 - 남포", "cls": "국도", "len": 611, "gmax": 10.8, "gavg": 3.2, "cut": 2, "sw": "", "bridge": "", "over": "", "source": "docs/research/map_opt NavMesh 설정까지 영향."}, {"id": "r-ring", "q": "순환(국도 루프)을 별도 도로 종류 Ring으로 만들까?", "options": ["예", "기존 Trunk 확장"], "recommended": "기존 Trunk 확장", "status": "confirmed", "answer": "기존 Trunk 확장 [준환 위임 일괄 확정 2026-11-16: 추천안 적용 — 검토 후 변경 가능]", "why": "02 §4는 B안에서 Ring을 제안했지만 C2는 강·고개가 노드를 정하므로 Trunk에 다리·고개 개념을 일반화하는 편이 작다."}, {"id": "r-bridge", "q": "다리를 오염 단계에서 폐쇄 가능한 요소로 쓸까?", "options": ["폐쇄 가능(오염 지역 진입 차단)", "항상 개방"], "recommended": "폐쇄 가능(오염 지역 진입 차단)", "status": "confirmed", "answer": "다리 폐쇄 없음(준환이 오염 시스템 결정에서 확정) [준환 위임 일괄 확정 2026-11-16: 추천안 적용 — 검토 후 변경 가능]", "why": "MASTER_PLAN §6 결정 항목 5(다리 폐쇄)와 연결. 규칙 변경이라 ADR 필요."}, {"id": "r-nav", "q": "다리마다 NavMeshLink를 두는 것을 전제로 할까?", "options": ["예", "아니오"], "recommended": "예", "status": "confirmed", "answer": "예 [준환 위임 일괄 확정 2026-11-16: 추천안 적용 — 검토 후 변경 가능]", "why": "현재 NavMeshLink 0건(MASTER_PLAN §8). 다리 의존 맵이라 봇 길찾기에 필수."}]}]}, {"id": "terrain", "title": "산악·지형", "order": 43, "group": "월드", "summary": "C2 지형: 최고 203 m, 걷기 가능(35도 이하) 86%. 봉우리 5, 능선 3, 능선 교전지 3, 채석장 2, 강 2. 걷기 목표는 03_mountains.md 제안값(35~38도, 88% 이상).", "status": "proposed", "parts": [{"type": "prose", "title": "지형 개요", "paragraphs": ["현재 생성기(확정): 산악 구역 A는 중심 (520, 800) 반경 320 m, 정상 약 100 m이고 높이가 도로까지의 거리 하나에 곱해져 방사형 원뿔이 된다. 능선선·안부·테라스·절벽이 없다(03 §1). 플레이어 컨트롤러 slopeLimit은 45도인데 걷기 규칙은 40도라 불일치다(Player.prefab:85, WorldRules.cs:37).", "C2의 지형은 설계 페이지의 노이즈(능선 폴리라인 3개 + 봉우리 가우시안 + 안부 낮춤)로 만든 높이장이며 Unity 지형이 아니다. 실제 구현은 03_mountains.md §2.4 레이어 합성(골격 능선 + 도메인 워프 + 테라스 + 협곡 + 절벽 + 안식각 스무딩)을 따른다."]}, {"type": "table", "title": "현재 생성기 사실", "columns": [{"key": "item", "label": "항목", "kind": "text"}, {"key": "value", "label": "값", "kind": "text"}], "rows": [{"id": "cur-ridge", "status": "confirmed", "item": "지역 경계 능선 높이", "value": "34 m, 반폭 22 m, 경계당 고개 2개(폭 18 m)", "source": "Assets/_Project/Scripts/Core/World/WorldSpec.cs:42,56"}, {"id": "cur-mtn", "status": "confirmed", "item": "산악 구역 A", "value": "중심 (520, 800), 반경 320 m, BaseHeight 18, Relief 84(정상 약 100 m)", "sour eBypass", "assert": "길이 40 m 이상 절벽마다 반경 80 m 안에 우회로", "source": "docs/research/03_mountains.md §5"}, {"id": "tt9", "status": "proposed", "t": "T9 CoverDensityPerSlopeBand", "assert": "대역별 엄폐 밀도가 표 범위, 가장 가까운 엄폐까지 95백분위 12 m(완사면)/20 m(급사면) 이하", "source": "docs/research/03_mountains.md §5"}, {"id": "tt10", "status": "proposed", "t": "T10 NoCoverFloatingOrBuried", "assert": "암석·나무 y가 Height와 0.5 m 이내, 도로·대지 위 아님", "source": "docs/research/03_mountains.md §5"}, {"id": "tt11", "status": "proposed", "t": "T11 Height_NoOneMeterSpike", "assert": "이웃 샘플 고저차 1.4 m 이하(콜라이더 이빨 방지)", "source": "docs/research/03_mountains.md §5"}, {"id": "tt12", "status": "proposed", "t": "T12 Terrain_DeterministicHash", "assert": "같은 시드 격자 해시 동일(서버·클라이언트 일치)", "source": "docs/research/03_mountains.md §5"}, {"id": "tt13", "status": "proposed", "t": "T13 Overwatch_SightlineBand", "assert": "전망점 8방향 평균 가시거리 60~180 m, 한 곳이 모든 POI를 못 본다", "source": "docs/research/03_mountains.md §5"}, {"id": "tt14", "status": "proposed", "t": "T14 Mountain_ScatterBudget", "assert": "총 스캐터 8000 미만(3.23 km2에서는 재산정), 산 암석 >= 마을의 2배", "source": "docs/research/03_mountains.md §5"}]}, {"type": "prose", "title": "구현·측정 메모", "bullets": ["Terrain 유지(1 m heightmap 1장). 절벽·오버행은 프리팹 메시(암석 군집)로 처리. 2.4 x 2.0 km는 heightmap 2049~4097이 필요할 수 있어 별도 측정이 필요하다(미측정).", "결정론: 지형은 WorldPlan.Height()가 단일 기준(FillHeights_MatchesHeight 테스트). 새 코드도 사칙연산과 Sqrt만 쓰고 삼각함수는 테이블화한다(03 §2.4).", "미측정: 현재 경사 분포는 코드 읽기 추정이다(03 A1). 능선 위 샷의 드로우콜·삼각형(PERF_BUDGET 2,500/1.5M)도 측정 전이다."]}, {"type": "decisions", "title": "정해야 할 것", "items": [{"id": "g-walk", "q": "걷기 한계를 35도(88%)로 할까 38도로 할까?", "options": ["35도, 88% 이상", "38도, 95% 이상"], "recommended": "35도, 88% 이상", "status": "confirmed", "answer": "35도, 88% 이상 [준환 위임 일괄 확정 2026-11-16: 추천안 적용 — 검토 후 변경 가능]", "why": "컨트롤러 slopeLimit을 45 -> 40도로 낮추고 걷기 규칙과 일치시키는 ADR이 필요(03 B1). 페이지 현재값 86%는 목표에 2%p 부족."}, {"id": "g-speed", "q": "경사별 이동 속도 계수를 도입할까?", "options": ["예(15도 1.0 -> 38도 0.45)", "아니오"], "recommended": "예(15도 1.0 -> 38도 0.45)", "status": "confirmed", "answer": "예(15도 1.0 -> 38도 0.45) [준환 위임 일괄 확정 2026-11-16: 추천안 적용 — 검토 후 변경 가능]", "why": "현재 코드에 slope/slide 처리가 없다(03 §1). 캐릭터 트랙과 합의 필요."}, {"id": "g-height", "q": "최고 203 m를 허용할까(MaxHeight 120 m는 현재값)?", "options": ["허용(MaxHeight 상향)", "낮춰서 120~150 m"], "recommended": "허용(MaxHeight 상향)", "status": "confirmed", "answer": "허용(MaxHeight 상향) [준환 위임 일괄 확정 2026-11-16: 추천안 적용 — 검토 후 변경 가능]", "why": "03 §2.3은 70~100 m를 말했지만 이는 1024 m 맵 기준. 2.4 km 맵에서는 비례가 다르다."}, {"id": "g-adr", "q": "경사 대역·규모 수치(03 §2.1~2.3)를 ADR로 확정할까?", "options": ["예", "측정(A1) 후 확정"], "recommended": "측정(A1) 후 확정", "status": "open", "answer": "", "why": "경사 분포는 추정이다. A1/A2(현재 경사 측정, 컨트롤러 실측) 결과로 조정될 수 있다(03 §8)."}, {"id": "g-hm", "q": "heightmap 해상도를 1 m 유지할까 상향할까?", "options": ["1 m 유지(타일 분할)", "2049 이상"], "recommended": "1 m 유지(타일 분할)", "status": "confirmed", "answer": "1 m 유지(타일 분할) [준환 위임 일괄 확정 2026-11-16: 추천안 적용 — 검토 후 변경 가능]", "why": "크기가 4.6배. Terrain 타일 분할/스트리밍 비용은 미측정이라 측정 후 결정."}]}]}, {"id": "pollution", "title": "오염 시스템 (최종 지역)", "order": 45, "group": "시스템", "status": "proposed", "summary": "자기장 대신 방사능 오염(하이브리드, 2026-11-16 확정): 지역 단위로 오염을 확정하고 전선이 지형을 따라 도심 방향으로 퍼진다. 전선이 지나간 지역은 계속 위험하며, 지역 간 탈출은 열쇠로 여는 엘리베이터(1회용, 비오염 지역으로만). 세부 수치는 시뮬레이션 후 조정.", "parts": [{"type": "prose", "title": "정의", "paragraphs": ["섬은 6개 지역으로 나뉜다(강·능선 기준). 시간이 지나면 지역이 하나씩 '오염 확정'되고, 확정된 지역에서는 오염 전선이 안쪽(도심 방향)으로 퍼지며 전선 뒤는 통행 불가에 가까운 위험지대가 된다. 마지막에 남는 지역이 최종 지역이다.", "근거: 준환의 선택 'C 하이브리드'. 지금 구현은 'SPEC §3 지역 순차 봉쇄'(지역 4개, 엘리베이터 3~4대/지역)이며 규칙이 애매하다고 판단돼 이 문서로 확정한다. 규칙 변경이므로 ADR 필수(CLAUDE.md 규칙 5).", "준환의 결정(2026-11-16): ① 물리 차단은 없다. 오염은 '전선'이 퍼지며 일으키고, 전선이 지나간 지역 전체가 계속 위험하다(전선은 그 경계). ② 지역 간 이동(탈출)은 '열쇠로 여는 엘리베이터'로만 가능하다. 열쇠는 1회용이며 비오염 지역으로만 이동한다. ③ 최종 지역은 6개 중 무작위(육로 연결 보장). ④ 판 길이 20~25분. ⑤ 데미지는 단계가 갈수록 증가. ⑥ 예고는 사이렌+방송+지도 점멸 90~120초 전. ⑦ 방독 아이템은 소모성으로 전선을 짧게 통과 가능(최종 지역에서는 무효).", "열쇠 엘리베이터 규칙(2026-11-16): 열쇠는 희귀 파밍 + 보급상자에서 판당 약 6~8개. 팀원 중 열쇠를 가진 한 명이 승강장에서 사용하면 팀원이 함께 탑승할 수 있다(열쇠 1개 소모). 목적지는 본인이 선택한 비오염 지역의 승강장. 전선이 닥친 지역의 승강장도 작동하지만, 한 번 쓰면 '전력 충전' 시간 동안 사용할 수 없고 충전되면 다시 쓸 수 있다.", "전선·시간표 확정(2026-11-16): 위 단계표와 속도(평지 60 / 도로 100 / 급경사 30 m/분)를 사용. 열쇠 수(판당 6개 기준)와 팀 인원(o2)은 함께 확정해야 한다 — 7개·4인 분대면 위협 지역 인원의 절반 이상이 빠져나가 압박이 약해진다."], "bullets": ["강·산 지형이 지역 경계 → 다리와 고개가 병목이 되어 '언제 건너고 어디로 빠질지' 전략이 생긴다.", "지역 순서는 시드로 무작위 + 남은 지역이 항상 육로로 이어지는 순서만 허용(C2 시안의 '폐쇄 순서 뽑기' 방식).", "서버가 시간·시드만으로 상태를 계산하고 클라이언트에는 '지역 상태 + 전선 위치'만 복제한다(작은 데이터)."]}, {"type": "table", "title": "단계표 (시뮬레이션 추천값, 확정 2026-11-16)", "columns": [{"key": "phase", "label": "단계", "kind": "tag"}, {"key": "t", "label": "시작(분, 제안)", "kind": "text"}, {"key": "alive", "label": "남은 지역", "kind": "num"}, {"key": "event", "label": "일어나는 일", "kind": "text"}, {"key": "warn", "label": "예고", "kind": "text"}], "rows": [{"id": "p0", "status": "confirmed", "phase": "0 투입", "t": "0", "alive": 6, "event": "엘리베이터 투입, 파밍", "warn": "-", "source": "pollution_sim_notes.md"}, {"id": "p1", "status": "confirmed", "phase": "1", "t": "4", "alive": 5, "event": "첫 지역 오염 확정, 전선 시작 · DPS 2/초", "warn": "105초 전", "source": "pollution_sim_notes.md"}, {"id": "p2", "status": "confirmed", "phase": "2", "t": "7.5", "alive": 4, "event": "두 번째 지역 오염 · DPS 3.2/초", "warn": "105초 전", "source": "pollution_sim_notes.md"}, {"id": "p3", "status": "confirmed", "phase": "3", "t": "10.5", "alive": 3, "event": "세 번째 지역 오염 · DPS 5/초", "warn": "105초 전", "source": "pollution_sim_notes.md"}, {"id": "p4", "status": "confirmed", "phase": "4", "t": "13", "alive": 2, "event": "네 번째 지역 오염 · DPS 8/초", "warn": "105초 전", "source": "pollution_sim_notes.md"}, {"id": "p5", "status": "confirmed", "phase": "5", "t": "15", "alive": 1, "event": "다섯 번째 지역 오염 · DPS 12.6/초", "warn": "105초 전", "source": "pollution_sim_notes.md"}, {"id": "p6", "status": "confirmed", "phase": "6 최종", "t": "16.5~22", "alive": 1, "event": "여섯 번째(최종 지역) 확정, 전선이 최종 지역 중심으로 수렴 · DPS 20/초", "warn": "105초 전", "source": "pollution_sim_notes.md"}]}, {"type": "prose", "title": "열쇠 엘리베이터 (신규 기능)", "paragraphs": ["엘리베이터가 투입 전용에서 '지역 탈출 수단'으로 확장된다. 열쇠(1회용)를 승강장에서 쓰면 비오염 지역의 승강장으로 이동한다. 오염 지역으로는 이동할 수 없다.", "아이템 '열쇠'는 이미 코드에 존재하지만(armor_items 섹션 참조) 루팅 표에는 없고 용도가 다르다. 새 아이템 종류(예: 승강기 키)로 분리할지 기존 열쇠를 확장할지는 구현 시 결정.", "사용 순서(확정): 열쇠 보유자가 엘리베이터 버튼 앞에서 열쇠 삽입 → 엘리베이터 활성화 → 문 열림 → 30초 카운트다운(팀원 탑승 완료 시 열쇠 보유자가 수동으로 문 닫기 가능) → 지역 선택(15초 안에 선택하지 못하면 무효 처리)."], "bullets": ["열쇠: 판당 약 6~8개(희귀 파밍 + 보급상자). 50명 중 열쇠 소유자는 소수라 탈출은 팀 전략 자원이 된다.", "팀원 중 열쇠를 가진 한 명이 사용하면 팀원이 함께 탑승한다(열쇠 1개 소모). → ADR-055(1인 1기) 개정 필요.", "목적지: 본인이 선택한 비오염 지역의 승강장.", "전선이 닥친 지역의 승강장도 작동하지만 1회 사용 후 '전력 충전' 시간 동안 사용 불가.", "도로·다리는 계속 열려 있어 걸어서/차로 탈출도 가능(전선보다 앞서야 함).", "엘리베이터 이동 소리·연출·전력 충전 UI는 사운드·UI 파트 연동.", "봇이 열쇠를 쓸지는 봇 파트에서 결정.", "도착 직후 보호는 없다(매복 위험) — 도착 승강장 주변 교전을 규칙으로 허용.", "봇은 열쇠를 줍고, 전선이 임박하면 사용한다.", "문이 열린 30초 동안 누구나(적 포함) 탑승할 수 있다 — 적이 동승하면 도착지에서 즉시 교전. 열쇠 보유자가 문을 닫는 타이밍이 전략 요소.", "탑승 상한 4명. 무효(지역 미선택) 시 열쇠는 돌려받고 문이 닫히며 승강장은 재충전.", "열쇠 배치: 먼저 오염될 지역에 덜 배치(편중 0.5), 열쇠 사용 후 팀 쿨다운 3분 이상. 시뮬레이션상 7~8개 평균 이탈 약 25~28%(경계~적정)로 완화."]}, {"type": "decisions", "title": "정해야 할 세부 (준환 결정)", "items": [{"id": "pol_block", "q": "오염 지역 출입을 어떻게 막나?", "options": ["물리 차단 없음, 강한 지속 데미지(DPS 급상승)", "게이트·바리케이드로 물리 차단 + 안쪽 데미지", "전선만 데미지(지역 경계는 열림)"], "recommended": "물리 차단 없음, 강한 지속 데미지(DPS 급상승)", "status": "confirmed", "answer": "물리 차단 없음. 지역 간 이동은 열쇠로 여는 엘리베이터(1회용, 비오염 지역으로만). 데미지는 전선과 전선이 지나간 지역 안쪽(전선=경계, 지나간 지역 전체 지속 위험).", "why": "차단 벽은 구현·봇 AI·차량 충돌 비용이 크고 안에 갇힌 사람 처리가 필요하다. 강한 DPS가 규칙이 단순하고 방독 장비 전략도 살린다."}, {"id": "pol_dps", "q": "오염 데미지는 시간에 따라 어떻게 오르나?", "options": ["고정", "단계가 갈수록 증가", "전선 안쪽일수록 증가"], "recommended": "단계가 갈수록 증가", "status": "confirmed", "answer": "단계가 갈수록 증가", "why": "초반은 달아날 수 있게, 후반은 버틸 수 없게."}, {"id": "pol_warn", "q": "예고 시간과 방식은?", "options": ["사이렌+방송+지도 점멸 90~120초 전", "지도 표시만"], "recommended": "사이렌+방송+지도 점멸 90~120초 전", "status": "confirmed", "answer": "사이렌+방송+지도 점멸 90~120초 전", "why": "오염 위치를 놓치는 억울함 방지. 사운드 파트와 연동."}, {"id": "pol_time", "q": "판 길이 목표는?", "options": 도 모드(솔로/스쿼드)가 항상 보일 것."], "bullets": ["일반 플레이에는 방 만들기/방 목록이 없다. 방 생성은 '커스텀 모드'에서만.", "흐름: 로비에서 초대하면 내가 파티장 → 파티원이 합류하면 모드·시점 잠금 → 전원 준비 → 파티장 시작 → 매칭 대기(파티장만 취소) → 인게임 로딩 → 섬 집결 대기 구역 → 일정 인원이 차면 30초 카운트다운 → 엘리베이터 투입.", "준비/시작/취소는 하나의 상태 버튼으로 통합(파티 시작·혼자 시작·준비·준비 취소·매칭 취소 00:24).", "매칭 중 '사람 N / 봇 M 채움' 50칸 막대를 항상 표시, 시작이 막힌 사유를 한 줄로 안내.", "상단 고정 메뉴는 '층 표시기' 스타일(01~05 번호): 플레이 / 외형 / 훈련장 / 설정 / 크레딧, 서브탭 일반 매치 / 커스텀 모드. 재화·상점 없음.", "최소 인원 30명, 30초 카운트다운, 5분 경고, 2분 대기는 시안의 제안값(SPEC 미확정).", "시각 방향은 B 클린 모던(파랑 강조, 반투명 블러 패널, 알약형 컨트롤, 큰 타이포). 기본은 항상 다크, 라이트는 보조."]}, {"type": "prose", "title": "화면 흐름", "paragraphs": ["메인 메뉴 → (시작: 솔로/듀오/스쿼드 모드로 World 씬 로드 | 훈련장 | 방 만들기·참가 → 로비 → 준비 → 시작) → 엘리베이터 투입(문 3초 뒤 열림, 6초 스폰 보호) → 경기(HUD) → 사망/우승 → 결과 화면(킬캠 → 패널) → 관전 / 다시 시작 / 메인 메뉴. 경기 중 Esc = 일시정지 메뉴(설정 포함), Tab = 인벤토리, M = 지도."], "bullets": ["시작 버튼 레이블은 '시작 (솔로)'처럼 선택 모드를 표시. 모드 선택은 실행 중에만 유지(저장하지 않음, ADR-072).", "불러오는 중 문구 '불러오는 중...'이 중앙에 표시된다.", "서버가 값을 정하고 UI는 표시만 한다(UI_SPEC 원칙)."], "source": "Assets/_Project/Scripts/Gameplay/MainMenu.cs:96-111,145-156; Assets/_Project/Scripts/Core/Deployment.cs:11-12; docs/UI_SPEC.md:10"}, {"type": "table", "title": "화면·메뉴 목록 (현재 구현)", "columns": [{"key": "name", "label": "이름", "kind": "tag"}, {"key": "where", "label": "위치/진입", "kind": "text"}, {"key": "desc", "label": "내용", "kind": "text"}], "rows": [{"id": "main_menu", "status": "confirmed", "name": "메인 메뉴", "desc": "타이틀 SUBLEVEL + STEADY TO VIVID STUDIO. 버튼: 모드(솔로→듀오→스쿼드 순환) · 시작 · 훈련장 · 방 만들기 · 참가 · 설정 · 크레딧 · 종료. 하단에 조작 힌트 한 줄, 우하단 버전. 씬은 MainMenuBuilder가 만들고 UI는 코드(UiKit uGUI)", "where": "처음 실행(빌드 목록 첫 씬)", "source": "Assets/_Project/Scripts/Gameplay/MainMenu.cs:11-15,220-231; Assets/_Project/Editor/MainMenuBuilder.cs:9-12"}, {"id": "lobby", "status": "confirmed", "name": "방 만들기/참가/로비", "desc": "방 만들기(호스트), 참가(IP:포트 입력), 실패 사유 표시, 로비(사람 목록·준비 상태·봇 수·시작 버튼). 네트워크는 LobbyNet", "where": "메인 메뉴 > 방 만들기·참가", "source": "Assets/_Project/Scripts/Gameplay/LobbyScreen.cs:11-13"}, {"id": "settings", "status": "confirmed", "name": "설정(환경 설정)", "desc": "탭 5개: 그래픽 / 오디오 / 컨트롤 / 키 설정 / 게임 플레이. 그래픽은 기본/고급 페이지. 슬라이더·선택 행 + 오른쪽 설명 패널, 기본·적용·뒤로 가기. 변경은 즉시 미리보기, 적용해야 저장. 메인 메뉴와 Esc 메뉴가 공유. 1920x1080 기준 캔버스", "where": "메인 메뉴 / Esc 메뉴", "source": "Assets/_Project/Scripts/Gameplay/SettingsScreen.cs:8-14; Assets/_Project/Scripts/Gameplay/SettingsCatalog.cs:78-79"}, {"id": "credits", "status": "confirmed", "name": "크레딧", "desc": "스튜디오명 + 크레딧이 필요한 에셋(Credits.Entries: 제목·제작자·라이선스·출처 링크·용도) + 뒤로 가기. 현재 항목은 CC BY 4.0 차량 모델 위주", "where": "메인 메뉴 > 크레딧", "source": "Assets/_Project/Scripts/Gameplay/CreditsScreen.cs:7-9; Assets/_Project/Scripts/Core/Credits.cs:14-29"}, {"id": "pause", "status": "confirmed", "name": "Esc 일시정지 메뉴", "desc": "계속하기/설정/메인 메뉴 등. 호스트 매치라 게임은 멈추지 않고 입력만 가로챈다", "where": "경기 중 Esc", "source": "Assets/_Project/Scripts/Gameplay/PauseMenu.cs:7-10"}, {"id": "inventory", "status": "confirmed", "name": "Tab 인벤토리", "desc": "주변(바닥) · 인벤토리(가방·조준경/부착물) · 캐릭터(실시간 3D 미리보기, 헬멧·조끼·가방 칸·내구도·용량 막대) · 무기 카드 1~3(부착물 5칸) · 근접(4)·투척(5). 끌어놓기, 더블클릭 줍기·사용, 우클릭 메뉴", "where": "경기 중 Tab", "source": "docs/UI_SPEC.md:11-14; Assets/_Project/Scripts/Gameplay/InventoryPreview.cs:9-13"}, {"id": "map", "status": "confirmed", "name": "전체 지도(M)", "desc": "구운 지도 그림 + 지역 이름·엘리베이터·통로·내 화살표 + 클릭으로 마커 1개 찍기. WorldInfo가 있는 씬에서만 열림. M 또는 Esc로 닫기", "where": "경기 중 M", "source": "Assets/_Project/Scripts/Gameplay/MapScreen.cs:10-13"}, {"id": "result", "status": "confirmed", "name": "결과 화면", "desc": "사망 시 몇 초 킬캠(킬러 이름·무기·거리) → 패널: 탈락(순위)/사망(팀 생존)/승리. 킬 수·준 피해·생존 시간·누가 죽였나. 버튼: 관전 / 다시 시작 / 메인 메뉴", "where": "사망·우승 후", "source": "Assets/_Project/Scripts/Gameplay/ResultScreen.cs:8-14"}, {"id": "spectate", "status": "confirmed", "name": "관전 카메라", "desc": "킬캠 뒤 살아 있는 전투원을 어깨 너머로 따라가며 체력·무기를 아래에 표시", "where": "결과 화면 > 관전", "source": "Assets/_Project/Scripts/Gameplay/SpectateCamera.cs:19-22"}, {"id": "training", "status": "confirmed", "name": "훈련장 + 체크리스트", "desc": "좌측 단계 체크리스트 + 상단 '다음에 할 일' 한 줄. 키는 현재 바인딩 SPEC §2). 전용 서버는 로컬 플레이어 없이 `--dedicated`.", "source": "Assets/_Project/Scripts/Net/MatchDirector.cs:121-145"}]}, {"type": "table", "title": "권위 모델", "columns": [{"key": "area", "label": "영역", "kind": "tag"}, {"key": "who", "label": "누가 결정", "kind": "text"}, {"key": "desc", "label": "설명", "kind": "text"}], "rows": [{"id": "a_move", "status": "confirmed", "area": "플레이어 이동", "who": "소유자 클라이언트(소유자 권위 NetworkTransform)", "desc": "소유자 몸이 곧 예측. Fish-Net 예측/서버 재생은 쓰지 않음(이동 코드가 점프·수영·파쿠르·차량 좌석 등과 얽혀 있어서). 서버 MoveGuard가 0.25초마다 위치를 검사해 의심스러우면 되돌린다(수평 (6.3+12)x1.2 m/s, 수직 60 m/s, 여유 2.5 m).", "source": "docs/DECISIONS.md:136 (ADR-126)"}, {"id": "a_fire", "status": "confirmed", "area": "사격·피해", "who": "서버", "desc": "클라이언트는 방향+viewTick만 보낸다. 탄도·관통·피해는 서버 계산. 연사 속도 상한 무기 x1.5+버스트 4.", "source": "docs/DECISIONS.md:151-152 (ADR-141,142)"}, {"id": "a_bot", "status": "confirmed", "area": "봇", "who": "서버만", "desc": "봇은 서버에서만 시뮬한다. 감지 레이캐스트 0.15초 주기, NavMesh 서버.", "source": "Assets/_Project/Scripts/AI/BotController.cs:19; docs/research/MASTER_PLAN.md:3"}, {"id": "a_loot", "status": "confirmed", "area": "루팅·인벤토리", "who": "서버", "desc": "LootItem NetworkObject(SyncVar), 줍기 거리 3 m + 지연 여유 1.5 m 서버 검사.", "source": "docs/MP_AUDIT_WORLD.md:18"}, {"id": "a_zone", "status": "confirmed", "area": "구역·날씨", "who": "서버가 시드·시각을 정함", "desc": "ZoneUpdate, SkyState 방송. 클라이언트는 받은 시드로 같은 하늘·안개를 계산(ADR-131).", "source": "docs/MP_AUDIT_WORLD.md:15-16"}, {"id": "a_veh", "status": "confirmed", "area": "차량", "who": "서버(상태 복제)", "desc": "차량은 되감기 제외(ADR-141). 상세는 MP_AUDIT_VEHICLES.md 참고.", "source": "docs/MP_AUDIT_VEHICLES.md"}]}, {"type": "table", "title": "복제되는 것 (수단별)", "columns": [{"key": "kind", "label": "수단", "kind": "tag"}, {"key": "what", "label": "내용", "kind": "text"}, {"key": "desc", "label": "특징", "kind": "text"}], "rows": [{"id": "r_obj", "status": "confirmed", "kind": "NetworkObject + SyncVar", "what": "전투원(플레이어·봇), 아이템, 차량, 투척물(연막·불), 보급 상자 등", "desc": "관심 영역 필터를 받는다. 늦게 들어온 클라이언트도 현재 상태를 받는다(투척물은 eData/rules.json:105"}, {"id": "o_thr", "status": "confirmed", "kind": "투척물(연막·불·폭발)", "m": 200, "desc": "", "source": "Assets/_Project/Data/Resources/GameData/rules.json:105"}, {"id": "o_hide", "status": "confirmed", "kind": "깜빡임 방지", "m": 0, "desc": "이미 보이는 객체는 반경 x1.2까지 유지(HideExtraFraction 0.2).", "source": "Assets/_Project/Data/Resources/GameData/rules.json:105"}, {"id": "o_rule", "status": "confirmed", "kind": "항상 보냄", "m": 0, "desc": "자기 소유, 같은 팀, 팀원이 탄 차량, NetworkObject 아닌 전역 상태. 죽은 클라이언트는 전투원·차량·투척물 전부 받고 아이템만 거리로 거른다. 조건은 시간형이라 Fish-Net이 약 0.5초 주기로 재검사(들어올 때 최대 0.5초+ 지연).", "source": "docs/DECISIONS.md:145 (ADR-135)"}], "note": ""}, {"type": "prose", "title": "지연 보상 (LagComp)", "paragraphs": ["서버가 모든 전투원 위치를 링버퍼(240개, 약 1초)에 기록하고, 클라이언트가 보내는 viewTick(마지막 받은 서버 틱 - 보간 2틱)만큼 되감아 사격자 밖의 전투원을 그 시각 위치로 옮긴 뒤 레이캐스트하고 되돌린다. 되감기 상한 0.25초(왕복 약 180 ms까지). 호스트와 봇의 사격은 되감기 없음. 문·유리·차량은 되감지 않는다. 사격마다 Physics.SyncTransforms 비용이 든다(건물 콜라이더가 수만 개로 늘면 증가, 06 문서 I10 — 영향 낮음, 관찰)."], "source": "docs/DECISIONS.md:151 (ADR-141); Assets/_Project/Scripts/Core/LagComp.cs:66-70; Assets/_Project/Scripts/Net/LagCompensation.cs:54,82"}, {"type": "prose", "title": "전용 서버 문서 요약", "paragraphs": ["빌드: `tools/unity.sh build server` (macOS Mono, 약 1분) / server-win은 미검증. 실행: `--dedicated --port 7770 --bots 15 --region C --max-players 16 --start-seconds 60` + `-batchmode -nographics`. 끝: 결정 20초 뒤 / 모두 떠난 지 30초 뒤 / 150초간 아무도 안 옴 → 로비로 복귀. SIGTERM에 정상 종료. 잘못된 인자는 코드 2로 종료."], "bullets": ["아직 확인하지 않은 것: Windows 서버 빌드·실행, 다른 기기 접속(방화벽·NAT), 두 사람 이상, 서버 CPU·메모리 예산(PERF_BUDGET에 서버 항목 없음), 장시간 운영.", "한 프로세스에 방 하나라 50명 방을 여러 개 운영하려면 프로세스 여러 개를 띄우는 구조다(추정)."], "source": "docs/DEDICATED_SERVER.md:1-60; Assets/_Project/Scripts/Core/ServerArgs.cs:71-83"}, {"type": "table", "title": "대역폭 실측 (16명 + 봇 20)", "columns": [{"key": "case", "label": "조건", "kind": "tag"}, {"key": "bps", "label": "클라이언트당 B/s", "kind": "num"}, {"key": "see", "label": "보이는 전투원/아이템/차량", "kind": "text"}], "rows": [{"id": "b_off", "stat 선(min/d 후 최대 거리에서 0), 도플러 없음. 범주별 거리(최소~최대 m): Body 2~40, Gunshot 12~750, Explosion 15~800, Vehicle 6~150, Elevator 3~60, Impact 3~60.", "gap": "좌우 패닝만 있고 높이(층)·차폐·잔향이 없다. HRTF/공간화 플러그인 사용 여부는 확인 필요.", "source": "Assets/_Project/Scripts/Gameplay/SpatialAudio.cs:5-30"}, {"id": "c_far", "status": "confirmed", "part": "총성 거리 처리", "now": "근거리층(30 m까지 단독)과 원거리층(200 m부터 단독)을 등출력 교차 페이드, 50 m부터 저역 통과 22 kHz → 1.2 kHz, 소음기는 4배 먼 소리로 취급.", "gap": "실내/실외 꼬리 구분 없음, 건물 사이 반사 없음(06 문서 N4).", "source": "Assets/_Project/Scripts/Gameplay/SpatialAudio.cs:21,45-50; Assets/_Project/Scripts/Core/SoundRules.cs:76-98"}, {"id": "c_duck", "status": "confirmed", "part": "환경음", "now": "바람·새(낮)·귀뚜라미(밤)·물가·실내 룸톤을 전부 코드로 합성(AudioClip.Create), 지역 종류·지붕·해안 근접으로 섞고 총성에 덕킹(NoteLoud).", "gap": "지역 종류가 4개뿐, 도심 소음·원거리 총성 반향 없음.", "source": "Assets/_Project/Scripts/Gameplay/SpatialAudio.cs:94-110; Assets/_Project/Scripts/Gameplay/AmbientBeds.cs:5-12"}, {"id": "c_step", "status": "confirmed", "part": "발소리", "now": "표면 6종(Concrete, Metal, Wood, Grass, Dirt, Water) x Resources/Steps/<표면> 클립 5개(물 4개)를 이름순 정렬해 랜덤 재생. 범위 = 40 m x 자세계수 x 질주 1.25 x 표면 음량.", "gap": "아래 '표면 판정 결함' 참고.", "source": "Assets/_Project/Scripts/Core/SoundRules.cs:7,62-64; Assets/_Project/Scripts/Gameplay/CombatantAudio.cs:200-210"}, {"id": "c_shot", "status": "confirmed", "part": "총성", "now": "근거리 4종(권총·SMG·소총·산탄총, CC0 라이브러리를 잘라 사용) + 원거리 5종(저격 포함, 같은 라이브러리의 mid distance 녹음을 모노 변환·저역 통과·저음 반사 2개 추가해 파생).", "gap": "원본이 한 라이브러리의 단발 녹음이라 변형이 적다. Sentinel(저격 대용)은 소총 소리를 낮은 피치로 재사용(CombatantAudio.cs:25). 매 발 랜덤 피치 지터(PitchJitter) 적용, 변형 개수는 무기당 1개 추정.", "source": "docs/ASSET_LEDGER.md:39; Assets/_Project/Scripts/Core/SoundRules.cs:76-98"}, {"id": "c_reload", "status": "confirmed", "part": "장전", "now": "OpenGameArt CC0 3개(권총·소총·산탄총). 다른 무기가 어느 것을 쓰는지는 확인 필요.", "gap": "탄피·격발 공이·빈 탄창 소리 없음(확인 필요).", "source": "docs/ASSET_LEDGER.md:40"}, {"id": "c_glass", "status": "confirmed", "part": "유리 깨짐", "now": "파일 없음. 노이즈와 짧은 고음 톤을 코드로 합성한 0.9초 충돌음 + 파편 표면 매핑 표 한 개(머티리얼 이름 또는 콜라이더 태그). 이름 파싱 폐기.", "source": "Assets/_Project/Scripts/Gameplay/CombatantAudio.cs:218-240"}, {"id": "w_bul", "status": "confirmed", "item": "탄흔도 같은 방식", "desc": "House=Wood, 나머지 건물=Metal, 정거장=Concrete로 건물 종류만 본다. 지붕·소품 구분 없음(shortcut 주석).", "fix": "같은 표면 태그를 쓴다. BulletSurfaceTag가 이미 있어 확장하면 됨.", "source": "Assets/_Project/Scripts/Net/BulletSurfaces.cs:24-30"}, {"id": "w_stair", "status": "confirmed", "item": "계단 추정", "desc": "폭 0.4 m 미만 박스를 계단으로 본다(shortcut 주석). 지붕·소품은 구분되지 않는다.", "fix": "계단·지붕·소품 박스에 태그.", "source": "Assets/_Project/Scripts/Gameplay/CombatantAudio.cs:237-240"}, {"id": "w_road", "status": "confirmed", "item": "도로·지형", "desc": "도로는 콜라이더가 없어 PavedRoads.Contains로 판정해 Concrete로 매핑. 지형은 레이어 이름에 Grass/Dirt/Mud가 들어 있는지로 판정, 없으면 Concrete.", "fix": "아스팔트·자갈·모래 등 표면 확장, 지형 레이어 id에 표면 태그를 명시.", "source": "Assets/_Project/Scripts/Gameplay/CombatantAudio.cs:221-226"}, {"id": "w_test", "status": "confirmed", "item": "테스트 공백", "desc": "FootstepSurfaceTests가 기존 4종만 확인한다. 새 재질로 바뀌어도 소리는 안 바뀐다.", "fix": "표면 태그 표를 테스트 데이터로 삼는다.", "source": "docs/research/06_missed_items.md:B4"}, {"id": "w_ai", "status": "confirmed", "item": "AI 청각 연동", "desc": "봇의 발소리 청취(BotHearing.SurfaceAt)가 같은 함수를 쓴다. 표면 판정을 고치면 봇 청취 거리도 바뀐다.", "fix": "회귀 테스트(봇 감지 반경) 필요.", "source": "Assets/_Project/Scripts/Gameplay/CombatantAudio.cs:211-212"}]}, {"type": "prose", "title": "준환의 불만", "paragraphs": ["총소리·걸음·창문 깨짐의 약 90%가 '스타워즈' 같다는 지적(MASTER_PLAN §2). 현실적이고 층·방향이 들리는 위치 기반 소리를 원한다. 후보를 에이전트가 모아 오면 준환이 전부 듣고 직접 고른다."], "bullets": ["원인 후보(추정, 아직 청취 비교 없음): ① 총 외 대부분이 코드 합성음(유리·문·차량·엘리베이터·천둥·탄 스침), ② 탄 스침이 SF 레이저와 비슷한 하강 공명음, ③ 발소리가 한 팩(Kenney 임팩트 소리)에 눈·금속 충돌음을 대용해 질감이 단일, ④ 총성은 단발 녹음 몇 개라 변형이 적음.", "완료 기준(제안): 같은 건물 2층에서 사격·걷기를 재생해 방향·층 구분이 되는 자동 테스트 + 준환 청취."], "source": "docs/research/MASTER_PLAN.md:31"}, {"type": "table", "title": "목표 설계 (MASTER_PLAN §2, 모두 제안)", "columns": [{"key": "part", "label": "항목", "kind": "tag"}, {"key": "design", "label": "설계안", "kind": "text"}, { 않고 OnAnimatorIK를 쓰는 것을 권장(의존성 추가는 먼저 묻는다).", "실제 캡처로 현재 트리를 다시 확인하지는 않았다. 아래 결함 원인은 04 감사의 코드 읽기 결과다."], "source": "docs/research/04_animation_audit.md:1-8; docs/DECISIONS.md:176 (ADR-166); docs/research/01_character.md:5-10", "status": "confirmed"}, {"type": "table", "title": "레이어 구조 (현재 vs 계획)", "columns": [{"key": "layer", "label": "레이어", "kind": "tag"}, {"key": "now", "label": "현재", "kind": "text"}, {"key": "plan", "label": "계획(Humanoid)", "kind": "text"}], "rows": [{"id": "l_base", "status": "confirmed", "layer": "Base", "now": "Locomotion 2D 블렌드(Idle/Walk/Run/Run_Back 등) + Death 상태, 파라미터 Move, Pace, AirPhase. 기어가기 위상은 코드 추가(Gait.cs).", "plan": "이동 2D 블렌드(전/후/좌/우/대각) + Stance 파라미터(서기·웅크림·엎드림) + 사망.", "source": "Assets/_Project/Prefabs/M1_5/Character.controller:88-136; docs/research/04_animation_audit.md:78-80"}, {"id": "l_upper", "status": "confirmed", "layer": "Upper", "now": "Lowered/Aim/Shoot/Hit/Air + 펀치 상태. 소총류는 이 레이어를 꺼 두고(CombatantAnimation.cs:289) 코드로 오른손 Reach + 왼손 Grip 2본 IK(PoseRifle)를 매 프레임 건다.", "plan": "조준·사격 레이어(소총 마스크 = Humanoid 상체 AvatarMask).", "source": "Assets/_Project/Prefabs/M1_5/Character.controller:148-166; docs/research/04_animation_audit.md:22-25"}, {"id": "l_action", "status": "proposed", "layer": "Action", "now": "없음(장전·꺼내기·투척·치료는 코드 포즈 ReloadMotion 등)", "plan": "장전·꺼내기·집어넣기·치료·투척(트리거, 위 몸 마스크). 손 동작을 클립이 담당.", "source": "docs/research/04_animation_audit.md:93-94"}, {"id": "l_add", "status": "proposed", "layer": "Additive", "now": "없음", "plan": "숨쉬기·피격·반동 가산.", "source": "docs/research/04_animation_audit.md:93-94"}, {"id": "l_aim", "status": "proposed", "layer": "시선(위아래)", "now": "RifleHold.FollowedPitch/TorsoPitchShare 수식으로 Swat 척추에 피치를 나눔.", "plan": "같은 수식을 유지하고 Humanoid Spine/Chest/Neck(GetBoneTransform)에 분배. LateUpdate.", "source": "docs/research/04_animation_audit.md:96; docs/research/MASTER_PLAN.md:151"}]}, {"type": "table", "title": "클립 인벤토리", "columns": [{"key": "clip", "label": "클립", "kind": "tag"}, {"key": "have", "label": wat 클립", "have": "있음", "note": "Idle/Walk/Run/Run_Back, HitRecieve, Punch_Left/Right, Death. 교체 후에는 Quaternius 쪽을 폐기.", "source": "docs/research/04_animation_audit.md:74; Assets/_Project/Prefabs/M1_5/Character.controller:10-360"}, {"id": "c_baked", "status": "confirmed", "clip": "구운 클립", "have": "17개", "note": "Mx_FiringRifleStand, ProneFiringRifle, ProneReloadingRifle, ReloadRifleCrouch, ReloadingRifleStand, RifleAimingIdle, RifleCrouchWalk(+Back), RifleDeath, RifleIdle, RifleKneelIdle, RiflePullOut, RiflePutAway, RifleRun, RifleSideStep, RifleWalk, RifleWalkBack. 폐기 예정.", "source": "Assets/_Project/Prefabs/M1_5/Baked/"}]}, {"type": "table", "title": "알려진 결함과 원인", "columns": [{"key": "what", "label": "현상", "kind": "tag"}, {"key": "cause", "label": "원인", "kind": "text"}, {"key": "fix", "label": "해결 방향", "kind": "text"}], "rows": [{"id": "x_prone", "status": "confirmed", "what": "엎드리면 몸이 약 35도로 떠 있음(85도 눕힘 + 40도 머리 들기)", "cause": "모델 전체를 ProneModelPitchDeg 85도 앞으로 눕히고(몸통 선이 지면 위 5도), 그 위에 Turn(Torso, -ProneHeadLiftDeg 40)으로 가슴·머리를 다시 40도 세운다. 눈 높이 0.4 m(EyeDropMeters 1.2)에 머리를 맞추는 설계값이라 의도된 값이다. 팔은 armUp으로 45도 보정, 다리는 Swat 걷기 클립 그대로라 무릎이 굽어 발이 뜬다.", "fix": "클립 기반 엎드림(Humanoid)으로 교체, 85/40/45/0.15 코드와 armUp 삭제. 임시로 40→10도는 하지 않는다(테스트가 고정, 교체 확정).", "source": "docs/research/04_animation_audit.md:13-24; Assets/_Project/Scripts/Gameplay/CombatantAnimation.cs:250,476; Assets/_Project/Scripts/Core/Stance.cs:54-55"}, {"id": "x_bake", "status": "confirmed", "what": "구운 엎드림 클립을 샘플하면 캐릭터가 서 있음, RifleRun 8위상의 다리가 모두 같음(확신도 중간, 시트 한 장)", "cause": "MixamoBake.Bake가 Hips 회전을 Hips 뼈에만 쓰고, Swat 다리는 Hips가 아닌 Body 아래라 눕는 회전이 다리에 전달되지 않는다.", "fix": "Humanoid로 가면 사라진다(MixamoBake 폐기).", "source": "docs/research/04_animation_audit.md:19-20"}, {"id": "x_arm", "status": "confirmed", "what": "소총 스프린트·장전 때 왼팔이 늘어짐(젤리 팔)", "cause": "스프린트에서 SprintSupportRelease 0.9가 왼손 IK 가중치를 0.1로 낮춰 IK를 포기하면 Swat Run 클립의 팔이 그대로 남는다. 장전은 탄창 위치가 총에서 아래 17~30 cm(허리춤)라 팔이 아래로 내려간 모양이 된다(ReloadMotion.cs:34). 코드에 0 let ov = {}; try { ov = JSON.parse(localStorage.getItem(LS) || '{}'); } catch (e) {}
const save = () => { try { localStorage.setItem(LS, JSON.stringify(ov)); } catch (e) {} };
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const badge = s => s ? `<span class="badge ${s}">${ST[s] || s}</span>` : '';
const eff = (sid, id, key, v) => (ov[sid] && ov[sid][id] && key in ov[sid][id]) ? ov[sid][id][key] : v;
function setOv(sid, id, key, v){ (ov[sid] = ov[sid] || {})[id] = Object.assign(ov[sid][id] || {}, {[key]: v}); save(); }
function toggleTheme(){ const r = document.documentElement; const dark = r.dataset.theme ? r.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme:dark)').matches; r.dataset.theme = dark ? 'light' : 'dark'; }

function openCount(s){ let n = 0; (s.parts || []).forEach(p => { if (p.type === 'decisions') (p.items || []).forEach(d => { if (eff(s.id, d.id, 'status', d.status) !== 'confirmed') n++; }); }); return n; }
function menu(filter){
  const groups = {}; B.forEach(s => (groups[s.group || '기타'] = groups[s.group || '기타'] || []).push(s));
  let h = '';
  Object.keys(groups).forEach(g => { h += `<div class="grp">${esc(g)}</div>`; groups[g].forEach(s => { const o = openCount(s); h += `<a data-id="${s.id}" onclick="location.hash='#/${s.id}'"><span>${esc(s.title)}</span><span class="cnt">${o ? '<b>' + o + '</b>' : ''}</span></a>`; }); });
  document.getElementById('menu').innerHTML = h;
  document.getElementById('dcnt').innerHTML = '<b>' + B.reduce((a, s) => a + openCount(s), 0) + '</b>';
}
function colCell(c, v, r, sid){
  const k = c.kind || 'text';
  if (k === 'image') return v ? `<img class="th" loading="lazy" src="${esc(v)}" alt="" onerror="this.replaceWith('이미지 없음')">` : '<span class="src">-</span>';
  if (k === 'audio') return v ? `<audio controls preload="none" src="${esc(v)}"></audio>` : '<span class="src">-</span>';
  if (k === 'color') return v ? `<span class="sw" style="background:${esc(v)}"></span>${esc(v)}` : '';
  if (k === 'link') return v ? `<a href="${esc(v)}" target="_blank" rel="noopener">${esc(v)}</a>` : '';
  if (k === 'tag') return v ? `<span class="badge" style="background:var(--code)">${esc(v)}</span>` : '';
  return `<span data-e>${esc(v)}</span>`;
}
function table(s, p, pi){
  const cols = p.columns || [];
  let h = `<h3>${esc(p.title || '')}</h3><div class="tw"><table><tr><th>상태</th>${cols.map(c => `<th>${esc(c.label || c.key)}</th>`).join('')}<th>근거</th></tr>`;
  (p.rows || []).forEach((r, ri) => {
    const id = r.id || ('r' + pi + '_' + ri);
    const stat = eff(s.id, id, 'status', r.status);
    h += `<tr data-s="${s.id}" data-id="${esc(id)}" data-t="${esc(JSON.stringify(r).toLowerCase())}"><td><select class="rs" data-sid="${s.id}" data-id="${esc(id)}"><option value=""></option>${['confirmed','proposed','open'].map(x => `<option value="${x}" ${x === stat ? 'selected' : ''}>${ST[x]}</option>`).join('')}</select></td>`;
    cols.forEach(c => { const v = eff(s.id, id, c.key, r[c.key]); h += `<td class="${c.kind === 'num' ? 'num' : ''}" ${(!c.kind || c.kind === 'text' || c.kind === 'num') ? `contenteditable data-sid="${s.id}" data-id="${esc(id)}" data-key="${esc(c.key)}"` : ''}>${colCell(c, v, r, s.id)}</td>`; });
    h += `<td class="src">${esc(r.source || '')}${r.notes ? '<br>' + esc(r.notes) : ''}</td></tr>`;
  });
  return h + '</table></div>';
}
function decisions(s, p){
  let h = `<h3>${esc(p.title || '정해야 할 것')}</h3>`;
  (p.items || []).forEach(d => {
    const st = eff(s.id, d.id, 'status', d.status), ans = eff(s.id, d.id, 'answer', d.answer);
    h += `<div class="card" data-t="${esc((d.q + ' ' + (d.options || []).join(' ')).toLowerCase())}"><div class="dq">${badge(st)} ${esc(d.q)}</div><div class="opts">${(d.options || []).map(o => `<button class="${o === ans ? 'sel' : ''}" data-sid="${s.id}" data-id="${esc(d.id)}" data-opt="${esc(o)}">${esc(o)}${o === d.recommended ? ' ★' : ''}</button>`).join('')}<button data-sid="${s.id}" data-id="${esc(d.id)}" data-clear="1">되돌리기</button></div>${d.recommended ? `<div class="rec">추천: ${esc(d.recommended)}</div>` : ''}${d.why ? `<div class="why">${esc(d.why)}</div>` : ''}${ans && !(d.options || []).includes(ans) ? `<div class="why">선택: ${esc(ans)}</div>` : ''}</div>`;
  });
  return h;
}
function section(s){
  let h = `<h2>${esc(s.title)} ${badge(s.status)}</h2><p class="sum">${esc(s.summary || '')}</p>`;
  (s.parts || []).forEach((p, pi) => {
    if (p.type === 'prose') h += `<div class="card"><b>${esc(p.title || '')}</b>${(p.paragraphs || []).map(x => `<p>${esc(x)}</p>`).join('')}${p.bullets ? '<ul>' + p.bullets.map(x => `<li>${esc(x)}</li>`).join('') + '</ul>' : ''}</div>`;
    else if (p.type === 'table') h += table(s, p, pi);
    else if (p.type === 'decisions') h += decisions(s, p);
  });
  return h;
}
function home(){
  let h = '<h2>게임 정의서</h2><p class="sum">모든 항목은 하나의 데이터(docs/bible/data/*.json)에서 나옵니다. 상태: 확정 = 준환이 정했거나 현재 코드에 있음 · 제안 = 초안 · 미정 = 결정 필요.</p><div class="stats">';
  B.forEach(s => { const c = {confirmed:0, proposed:0, open:0}; (s.parts || []).forEach(p => (p.rows || p.items || []).forEach(r => { const st = eff(s.id, r.id, 'status', r.status); if (c[st] != null) c[st]++; })); h += `<div class="card" onclick="location.hash='#/${s.id}'"><b>${esc(s.title)}</b><div class="src">${esc(s.group || '')}</div><div style="margin-top:6px">${badge('confirmed')} ${c.confirmed} ${badge('proposed')} ${c.proposed} ${badge('open')} ${c.open}</div></div>`; });
  return h + '</div><div class="tools"><button onclick="exportOv()" class="p">내 수정 내보내기(JSON)</button><button onclick="if(confirm(\'브라우저에 저장된 수정을 모두 지울까요?\')){ov={};save();route()}">수정 초기화</button></div><p class="why">웹에서 한 수정(결정 선택, 상태, 셀 수정)은 이 브라우저에만 저장됩니다. 내보내기 JSON을 Claude에게 주면 data/*.json에 반영합니다.</p>';
}
function openList(){
  let h = '<h2>결정 대기</h2><p class="sum">모든 섹션의 미확정 결정 항목입니다.</p>';
  B.forEach(s => (s.parts || []).forEach(p => { if (p.type === 'decisions') { const items = (p.items || []).filter(d => eff(s.id, d.id, 'status', d.status) !== 'confirmed'); if (items.length) h += `<h3>${esc(s.title)} · ${esc(p.title || '')}</h3>` + decisions(s, {items}).replace(/^<h3>.*?<\/h3>/, ''); } }));
  return h;
}
function exportOv(){ const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(ov, null, 2)], {type:'application/json'})); a.download = 'bible_overlay.json'; a.click(); }
function route(){
  const id = (location.hash || '#/').slice(2); const m = document.getElementById('main'); menu();
  document.querySelectorAll('nav a[data-id]').forEach(a => a.classList.toggle('on', a.dataset.id === id));
  const s = B.find(x => x.id === id);
  m.innerHTML = id === 'decisions' ? openList() : s ? section(s) : B.length ? home() : '<div class="empty">데이터가 없습니다. python3 tools/bible_build.py 를 실행하세요.</div>';
  applyFilter(); window.scrollTo(0, 0);
}
function applyFilter(){
  const q = document.getElementById('q').value.trim().toLowerCase(); if (!q) return;
  if (!location.hash || location.hash === '#/') { /* search across sections */
    let h = `<h2>검색: ${esc(q)}</h2>`; let n = 0;
    B.forEach(s => (s.parts || []).forEach(p => (p.rows || []).forEach(r => { if (JSON.stringify(r).toLowerCase().includes(q)) { n++; h += `<div class="card"><a href="#/${s.id}"><b>${esc(s.title)}</b></a> · ${esc(p.title || '')}<br>${esc(Object.values(r).filter(v => typeof v === 'string').slice(0, 6).join(' · '))}</div>`; } })));
    document.getElementById('main').innerHTML = h + (n ? '' : '<div class="empty">결과 없음</div>'); return;
  }
  document.querySelectorAll('tr[data-t],.card[data-t]').forEach(e => e.style.display = e.dataset.t.includes(q) ? '' : 'none');
}
document.getElementById('q').addEventListener('input', () => { if (location.hash === '' || location.hash === '#/') route(); else applyFilter(); });
document.addEventListener('click', e => { const b = e.target.closest('button[data-sid]'); if (!b) return; const {sid, id, opt, clear} = b.dataset; if (clear) { setOv(sid, id, 'answer', ''); setOv(sid, id, 'status', 'open'); } else { setOv(sid, id, 'answer', opt); setOv(sid, id, 'status', 'confirmed'); } route(); });
document.addEventListener('change', e => { const s = e.target.closest('select.rs'); if (s) { setOv(s.dataset.sid, s.dataset.id, 'status', s.value); menu(); } });
document.addEventListener('focusout', e => { const t = e.target.closest('td[contenteditable]'); if (t) setOv(t.dataset.sid, t.dataset.id, t.dataset.key, t.innerText.trim()); });
addEventListener('hashchange', route); route();
</script>
</body>
</html>
